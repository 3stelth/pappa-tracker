<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🍼 Pappa Tracker</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍼</text></svg>">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --gabriel-pri: #3B82F6; --gabriel-acc: #2563EB; --gabriel-light: #E8F1FE; --gabriel-2: #60A5FA;
  --vittorio-pri: #14B8A6; --vittorio-acc: #0D9488; --vittorio-light: #E2FBF6; --vittorio-2: #2DD4BF;
  --accent: #3B82F6; --accent-2: #60A5FA; --accent-acc: #2563EB;
  --grad: linear-gradient(135deg,#60A5FA,#3B82F6);
  --bg-0: #EAF0FB; --bg-1: #E2E9F6;
  --txt: #0C1222; --sub: #5C6678; --hint: #98A0B2;
  --glass: rgba(255,255,255,0.55); --glass-2: rgba(255,255,255,0.40); --glass-strong: rgba(255,255,255,0.80); --solid: #F7FAFE;
  --glass-brd: rgba(255,255,255,0.80); --glass-brd-2: rgba(255,255,255,0.45);
  --hair: rgba(12,18,34,0.09);
  --shadow: 0 12px 36px rgba(22,32,72,0.13); --shadow-sm: 0 4px 16px rgba(22,32,72,0.08);
  --green: #10B981; --green-light: rgba(16,185,129,0.15);
  --red: #F43F5E; --red-light: rgba(244,63,94,0.13);
  --amber: #F59E0B; --amber-light: rgba(245,158,11,0.16);
  --blur: 20px; --blur-strong: 30px;
  --r-lg: 26px; --r-md: 18px; --r-sm: 13px;
  --tab-h: 76px;
}
body.dark {
  --bg-0: #060812; --bg-1: #0A0E1C;
  --txt: #EAEDF7; --sub: #99A1B7; --hint: #69708A;
  --glass: rgba(26,31,52,0.52); --glass-2: rgba(22,27,46,0.40); --glass-strong: rgba(28,34,58,0.82); --solid: #1B2238;
  --glass-brd: rgba(255,255,255,0.14); --glass-brd-2: rgba(255,255,255,0.07);
  --hair: rgba(255,255,255,0.09);
  --shadow: 0 16px 44px rgba(0,0,0,0.55); --shadow-sm: 0 6px 22px rgba(0,0,0,0.42);
  --green-light: rgba(16,185,129,0.20);
  --red-light: rgba(244,63,94,0.22);
  --amber-light: rgba(245,158,11,0.24);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg-0); }
body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif; color: var(--txt); max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(var(--tab-h) + 28px); letter-spacing: -0.01em; }
b, .num { font-variant-numeric: tabular-nums; }
/* ── Ambient background field (the signature: orbs glow in the active baby's color) ── */
.bg-field { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: radial-gradient(130% 100% at 50% -10%, var(--bg-1), var(--bg-0) 70%); pointer-events: none; }
.orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.55; transition: background 0.8s ease; will-change: transform; }
body.dark .orb { opacity: 0.42; filter: blur(70px); }
.orb-a { width: 320px; height: 320px; top: -90px; left: -70px; background: var(--accent); animation: float-a 22s ease-in-out infinite; }
.orb-b { width: 280px; height: 280px; top: 26%; right: -110px; background: var(--accent-2); animation: float-b 26s ease-in-out infinite; }
.orb-c { width: 360px; height: 360px; bottom: -130px; left: 30%; background: var(--accent); opacity: 0.32; animation: float-c 30s ease-in-out infinite; }
@keyframes float-a { 0%,100%{transform:translate(0,0)} 50%{transform:translate(40px,50px)} }
@keyframes float-b { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-50px,40px)} }
@keyframes float-c { 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,-40px)} }
/* ── Glass header ── */
.header { padding: max(16px,env(safe-area-inset-top)) 16px 14px; position: sticky; top: 0; z-index: 30; background: var(--glass); -webkit-backdrop-filter: blur(var(--blur-strong)) saturate(170%); backdrop-filter: blur(var(--blur-strong)) saturate(170%); border-bottom: 1px solid var(--glass-brd-2); }
.header-top { display: flex; align-items: center; justify-content: space-between; }
.app-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: center; gap: 7px; }
.app-sub { font-size: 11px; color: var(--sub); font-weight: 500; margin-top: 1px; }
.header-btns { display: flex; gap: 6px; align-items: center; }
.header-btns button { background: var(--glass-2); border: 1px solid var(--glass-brd-2); color: var(--txt); font-size: 15px; width: 34px; height: 34px; padding: 0; border-radius: 11px; cursor: pointer; font-weight: 600; font-family: inherit; display: inline-flex; align-items: center; justify-content: center; transition: transform 0.15s, background 0.2s; }
.header-btns button:active { transform: scale(0.9); }
/* ── Segmented control (baby switch) ── */
.pills { display: flex; gap: 4px; padding: 4px; background: var(--glass-2); border: 1px solid var(--glass-brd-2); border-radius: 15px; }
.pill { flex: 1; padding: 9px 0; border: none; border-radius: 11px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.3s cubic-bezier(.4,1.3,.5,1); white-space: nowrap; color: var(--sub); background: transparent; letter-spacing: -0.01em; }
.pill.on { color: #fff; background: var(--grad); box-shadow: 0 6px 16px -4px var(--accent); transform: translateY(-0.5px); }
/* Floating baby switch — sits in the thumb zone just above the tab bar */
.baby-switch { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tab-h) + 10px); width: min(480px,100%); padding: 0 14px; z-index: 92; }
.baby-switch .pills { background: var(--glass-strong); -webkit-backdrop-filter: blur(var(--blur-strong)) saturate(180%); backdrop-filter: blur(var(--blur-strong)) saturate(180%); box-shadow: 0 10px 30px -10px rgba(8,10,22,0.4); }
.baby-switch .pill { padding: 11px 0; font-size: 15px; }
body.has-baby-switch { padding-bottom: calc(var(--tab-h) + 80px); }
.tabs { display: flex; gap: 4px; }
.tab { flex: 1; padding: 8px 0; border: none; border-radius: 11px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.25s; white-space: nowrap; background: var(--glass-2); color: var(--sub); }
.tab.on { background: var(--glass-strong); color: var(--txt); }
/* ── Bottom tab bar ── */
.tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(480px,100%); z-index: 90; display: flex; padding: 9px 10px calc(9px + env(safe-area-inset-bottom)); gap: 4px; background: var(--glass); -webkit-backdrop-filter: blur(var(--blur-strong)) saturate(170%); backdrop-filter: blur(var(--blur-strong)) saturate(170%); border-top: 1px solid var(--glass-brd-2); }
.tabbar-btn { flex: 1; border: none; background: transparent; cursor: pointer; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px 0; color: var(--hint); border-radius: 13px; transition: color 0.2s, transform 0.15s; }
.tabbar-btn svg { width: 23px; height: 23px; stroke-width: 1.7; }
.tabbar-btn span { font-size: 10px; font-weight: 600; letter-spacing: -0.01em; }
.tabbar-btn.on { color: var(--accent); }
.tabbar-btn:active { transform: scale(0.9); }
.fab-wrap { position: fixed; bottom: calc(var(--tab-h) + 74px); right: max(16px,calc(50% - 232px)); z-index: 95; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
.fab-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 11px; }
.fab-action { display: inline-flex; align-items: center; gap: 10px; border: none; background: transparent; cursor: pointer; font-family: inherit; padding: 0; opacity: 0; transform: translateY(14px) scale(.92); pointer-events: none; transition: opacity .25s ease, transform .28s cubic-bezier(.32,1.25,.4,1); }
.fab-wrap.open .fab-action { opacity: 1; transform: none; pointer-events: auto; }
.fab-wrap.open .fab-action:nth-child(1){ transition-delay:.12s }
.fab-wrap.open .fab-action:nth-child(2){ transition-delay:.08s }
.fab-wrap.open .fab-action:nth-child(3){ transition-delay:.04s }
.fab-wrap.open .fab-action:nth-child(4){ transition-delay:0s }
.fab-action-label { background: var(--solid); border: 1px solid var(--glass-brd); padding: 8px 13px; border-radius: 13px; font-size: 13px; font-weight: 600; color: var(--txt); box-shadow: var(--shadow-sm); white-space: nowrap; }
.fab-action-ic { width: 46px; height: 46px; border-radius: 15px; background: var(--solid); border: 1px solid var(--glass-brd); display: inline-flex; align-items: center; justify-content: center; font-size: 21px; box-shadow: var(--shadow-sm); }
.fab-add { width: 56px; height: 56px; border-radius: 19px; background: var(--grad); color: #fff; border: none; cursor: pointer; box-shadow: 0 10px 28px -6px var(--accent); display: flex; align-items: center; justify-content: center; transition: transform .3s cubic-bezier(.4,1.3,.5,1); }
.fab-add .plus { display: inline-block; font-size: 30px; line-height: 1; transition: transform .3s cubic-bezier(.4,1.3,.5,1); }
.fab-wrap.open .fab-add .plus { transform: rotate(45deg); }
.fab-add:active { transform: scale(.9); }
.fab-overlay { position: fixed; inset: 0; z-index: 94; background: transparent; }
/* ── Cards & surfaces ── */
.cal-wrap { padding: 12px 14px 0; }
.cal { background: var(--glass); -webkit-backdrop-filter: blur(var(--blur)) saturate(160%); backdrop-filter: blur(var(--blur)) saturate(160%); border: 1px solid var(--glass-brd); border-radius: var(--r-md); padding: 13px; box-shadow: var(--shadow-sm); }
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-nav button { border: none; width: 30px; height: 30px; border-radius: 10px; font-size: 15px; cursor: pointer; font-weight: 700; font-family: inherit; background: var(--accent-soft,var(--glass-2)); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; }
.cal-nav span { font-weight: 700; font-size: 14px; letter-spacing: -0.01em; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; text-align: center; }
.cal-head { font-size: 10px; font-weight: 700; color: var(--hint); padding: 3px 0; text-transform: uppercase; letter-spacing: 0.03em; }
.cal-day { border: none; width: 100%; aspect-ratio: 1; border-radius: 12px; font-size: 13px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: transparent; font-family: inherit; font-weight: 600; color: var(--txt); transition: all 0.18s; }
.cal-day.other { color: var(--hint); opacity: 0.5; }
.cal-dots { display: flex; gap: 2px; }
.cal-dot { width: 4px; height: 4px; border-radius: 50%; }
.recap-section { padding: 14px 14px 0; }
.recap-label { font-size: 13px; font-weight: 700; color: var(--txt); margin-bottom: 9px; letter-spacing: -0.01em; }
.recap-row { display: flex; gap: 10px; }
.recap-card { flex: 1; min-width: 0; background: var(--glass); -webkit-backdrop-filter: blur(var(--blur)) saturate(160%); backdrop-filter: blur(var(--blur)) saturate(160%); border: 1px solid var(--glass-brd); border-radius: var(--r-md); padding: 13px 13px 12px; box-shadow: var(--shadow-sm); position: relative; }
.recap-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: var(--r-md) var(--r-md) 0 0; background: var(--cardgrad,var(--grad)); }
.recap-name { font-size: 14px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 4px; letter-spacing: -0.01em; }
.recap-line { display: flex; align-items: center; gap: 5px; font-size: 12px; margin-bottom: 4px; color: var(--sub); }
.recap-line b { font-weight: 700; color: var(--txt); }
.recap-line .sub { font-size: 10px; color: var(--hint); }
.recap-period { display: flex; flex-direction: column; gap: 1px; line-height: 1.2; }
.recap-period .sub { font-size: 14px; font-weight: 700; color: var(--txt); }
.recap-range { font-size: 9px; font-weight: 500; color: var(--hint); opacity: 0.7; letter-spacing: 0; }
.recap-line-last { margin-bottom: 8px; align-items: center; }
.recap-divider { height: 1px; background: var(--glass-brd); margin: 0 0 7px; border-radius: 1px; }
.therapy-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.therapy-badge { display: inline-flex; align-items: center; gap: 2px; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 8px; }
.therapy-badge.done { background: var(--green-light); color: var(--green); }
.therapy-badge.pending { background: var(--red-light); color: var(--red); }
.content { padding: 16px 14px 0; }
.content-title { font-size: 13px; font-weight: 700; color: var(--txt); margin-bottom: 9px; letter-spacing: -0.01em; }
.empty { background: var(--glass-2); border: 1px solid var(--glass-brd-2); border-radius: var(--r-md); padding: 22px 16px; text-align: center; color: var(--hint); font-size: 13px; font-weight: 500; }
.entry { background: var(--glass); -webkit-backdrop-filter: blur(var(--blur)) saturate(150%); backdrop-filter: blur(var(--blur)) saturate(150%); border: 1px solid var(--glass-brd); border-radius: var(--r-sm); padding: 11px 13px; box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 11px; margin-bottom: 8px; cursor: pointer; transition: transform 0.15s; position: relative; }
.entry::before { content: ''; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: var(--accent); }
.entry:active { transform: scale(0.99); }
.entry-icon { font-size: 19px; flex-shrink: 0; }
.entry-body { flex: 1; min-width: 0; }
.entry-top { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.entry-time { font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
.entry-ml { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.entry-tag { font-size: 9px; padding: 2px 7px; border-radius: 7px; font-weight: 700; }
.entry-note { font-size: 11px; color: var(--hint); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry-del { border: none; background: var(--red-light); color: var(--red); width: 26px; height: 26px; border-radius: 9px; font-size: 12px; cursor: pointer; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: inherit; transition: transform 0.15s; }
.entry-del:active { transform: scale(0.85); }
/* ── Goals (Obiettivi) ── */
.goal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.goal-col-head { font-size: 13px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.01em; text-align: center; }
.goal-slot { position: relative; background: var(--glass); border: 1px solid var(--glass-brd); border-radius: var(--r-sm); padding: 9px 10px 9px 14px; margin-bottom: 7px; box-shadow: var(--shadow-sm); cursor: pointer; transition: transform 0.15s; overflow: hidden; }
.goal-slot::before { content: ''; position: absolute; left: 0; top: 7px; bottom: 7px; width: 3px; border-radius: 3px; background: var(--slotcol,var(--accent)); }
.goal-slot:active { transform: scale(0.98); }
.goal-slot.pending { border-style: dashed; opacity: 0.72; background: var(--glass-2); }
.goal-slot.pending::before { opacity: 0.4; }
.goal-slot.next { opacity: 1; border-style: solid; border-color: var(--slotcol); box-shadow: 0 0 0 1px var(--slotcol) inset; }
.goal-slot.done { background: var(--green-light); }
.goal-slot.done::before { background: var(--green); }
.goal-slot.leftover { background: var(--red-light); }
.goal-slot.leftover::before { background: var(--red); }
.goal-warn { color: var(--red); font-weight: 900; margin-right: 2px; }
.goal-slot-idx { font-size: 10px; font-weight: 800; color: var(--slotcol,var(--accent)); }
.goal-slot-main { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.goal-slot-time { font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
.goal-slot-ml { font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
.goal-slot-sub { font-size: 10px; color: var(--hint); margin-top: 1px; }
.goal-left-badge { display: inline-block; font-size: 9px; font-weight: 700; color: var(--red); background: var(--red-light); padding: 1px 6px; border-radius: 6px; margin-top: 3px; }
.goal-more-badge { display: inline-block; font-size: 9px; font-weight: 700; color: var(--green); background: var(--green-light); padding: 1px 6px; border-radius: 6px; margin-top: 3px; }
.goal-check { color: var(--green); font-weight: 900; margin-right: 2px; }
.goal-summary { font-size: 10px; color: var(--sub); text-align: center; margin-top: 4px; font-weight: 600; }
.goal-preview { font-size: 12px; font-weight: 700; color: var(--txt); margin: 2px 0 12px; }
.therapy-item { background: var(--glass); -webkit-backdrop-filter: blur(var(--blur)) saturate(150%); backdrop-filter: blur(var(--blur)) saturate(150%); border: 1px solid var(--glass-brd); border-radius: var(--r-sm); padding: 12px 13px; box-shadow: var(--shadow-sm); margin-bottom: 8px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: transform 0.15s; position: relative; }
.therapy-item::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--titem,var(--accent)); }
.therapy-item:active { transform: scale(0.99); }
.therapy-item.done { background: var(--green-light); }
.therapy-item.done::before { background: var(--green); }
.therapy-item.ended { opacity: 0.6; cursor: default; }
.therapy-item.ended::before { background: var(--hint); }
.therapy-check { width: 26px; height: 26px; border-radius: 9px; border: 2px solid var(--hair); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; font-size: 15px; color: #fff; font-weight: 800; }
.therapy-check.checked { background: var(--green); border-color: var(--green); }
.therapy-name { font-weight: 700; font-size: 14px; letter-spacing: -0.01em; }
.therapy-name.checked { text-decoration: line-through; color: var(--hint); }
.therapy-cat { font-size: 9px; padding: 2px 7px; border-radius: 7px; font-weight: 700; }
.therapy-dose { font-size: 11px; color: var(--sub); margin-top: 2px; }
.therapy-done-badge { font-size: 9px; font-weight: 700; color: var(--green); background: var(--green-light); padding: 3px 7px; border-radius: 7px; }
.fab { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 50px; height: 50px; border-radius: 50%; color: #fff; border: none; font-size: 26px; font-weight: 300; cursor: pointer; box-shadow: var(--shadow); z-index: 100; display: flex; align-items: center; justify-content: center; }
/* ── Modals ── */
.modal-bg { position: fixed; inset: 0; background: rgba(8,10,22,0.45); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); z-index: 200; display: flex; align-items: flex-end; justify-content: center; animation: fade 0.25s ease; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal { background: var(--glass-strong); -webkit-backdrop-filter: blur(var(--blur-strong)) saturate(180%); backdrop-filter: blur(var(--blur-strong)) saturate(180%); border: 1px solid var(--glass-brd); border-bottom: none; border-radius: 28px 28px 0 0; padding: 14px 18px calc(28px + env(safe-area-inset-bottom)); width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; animation: slideUp 0.34s cubic-bezier(.32,1.1,.4,1); color: var(--txt); }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle { width: 38px; height: 5px; background: var(--hair); border-radius: 3px; margin: 0 auto 14px; }
.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; letter-spacing: -0.02em; }
.form-label { font-size: 12px; font-weight: 600; color: var(--sub); margin-bottom: 6px; display: block; }
.form-row { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; }
.form-select { flex: 1; padding: 11px; border-radius: var(--r-sm); border: 1px solid var(--glass-brd-2); font-size: 16px; font-weight: 600; background: var(--glass-2); color: var(--txt); text-align: center; font-family: inherit; }
.form-input { width: 100%; padding: 12px 14px; border-radius: var(--r-sm); border: 1px solid var(--glass-brd-2); font-size: 16px; font-family: inherit; outline: none; transition: border 0.2s, box-shadow 0.2s; background: var(--glass-2); color: var(--txt); }
.form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft,rgba(59,130,246,0.18)); }
.form-input.big { font-size: 22px; font-weight: 700; }
.form-input::placeholder { color: var(--hint); }
.chips { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.chip { padding: 9px 15px; border: 1px solid var(--glass-brd-2); border-radius: var(--r-sm); background: var(--glass-2); color: var(--sub); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit; }
.chip.on { border-color: transparent; background: var(--grad); color: #fff; box-shadow: 0 5px 14px -4px var(--accent); }
.form-actions { display: flex; gap: 10px; margin-top: 6px; }

    merged.therapyEnds = merged.therapyEnds || {};
    for (const bn in local.therapyEnds) {
      merged.therapyEnds[bn] = { ...(merged.therapyEnds[bn] || {}), ...(local.therapyEnds[bn] || {}) };
    }
  }
  // Goals (obiettivi pasti): oggetto piccolo, last-writer-wins (local vince)
  if (local.goals) merged.goals = { ...(merged.goals || {}), ...local.goals };
  // Therapy single-day skips: union of date arrays per baby/tid
  if (local.therapySkips) {
    merged.therapySkips = merged.therapySkips || {};
    for (const bn in local.therapySkips) {
      merged.therapySkips[bn] = merged.therapySkips[bn] || {};
      for (const tid in local.therapySkips[bn]) {
        const s = new Set([...(merged.therapySkips[bn][tid] || []), ...(local.therapySkips[bn][tid] || [])]);
        merged.therapySkips[bn][tid] = [...s];
      }
    }
  }
  for (const dateKey in local) {
    if (dateKey === '_tombstones' || dateKey === 'customTherapies' || dateKey === 'hiddenTherapies' || dateKey === 'therapyEnds' || dateKey === 'therapySkips' || dateKey === 'goals') continue;
    if (dateKey === 'doseOverrides') {
      merged.doseOverrides = merged.doseOverrides || {};
      const lDO = local.doseOverrides || {};
      for (const bn in lDO) {
        merged.doseOverrides[bn] = merged.doseOverrides[bn] || {};
        for (const tid in lDO[bn]) {
          const lArr = lDO[bn][tid] || [];
          const rArr = merged.doseOverrides[bn][tid] || [];
          const seen = new Set(rArr.map(o => o.from));
          merged.doseOverrides[bn][tid] = [...rArr, ...lArr.filter(o => !seen.has(o.from))];
        }
      }
      continue;
    }
    const lDay = local[dateKey];
    if (!lDay || typeof lDay !== 'object') continue;
    if (!merged[dateKey]) merged[dateKey] = {};
    for (const bn in lDay) {
      const lBd = lDay[bn] || {};
      const rBd = merged[dateKey][bn] || {};
      const out = { ...rBd };
      ['feeds','diapers','temperatures'].forEach(arrKey => {
        const lArr = Array.isArray(lBd[arrKey]) ? lBd[arrKey] : [];
        const rArr = Array.isArray(rBd[arrKey]) ? rBd[arrKey] : [];
        if (!lArr.length && !rArr.length) return;
        const byKey = {};
        rArr.forEach(e => { byKey[entryMergeKey(e, arrKey)] = e; });
        lArr.forEach(e => { byKey[entryMergeKey(e, arrKey)] = e; }); // local wins
        out[arrKey] = Object.values(byKey).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
      });
      // Weight: prefer the one with the newer addedAt; fall back to local then remote.
      const lW = lBd.weight, rW = rBd.weight;
      if (lW && rW) {
        const la = lW.addedAt || 0, ra = rW.addedAt || 0;
        out.weight = la >= ra ? lW : rW;
      } else if (lW) out.weight = lW;
      else if (rW) out.weight = rW;
      if (lBd.therapies || rBd.therapies) {
        out.therapies = { ...(rBd.therapies||{}), ...(lBd.therapies||{}) };
      }
      merged[dateKey][bn] = out;
    }
  }
  // Attach merged tombstones and apply to filter out anything that's been deleted
  if (mergedTombstones.length) merged._tombstones = mergedTombstones;
  else delete merged._tombstones;
  applyTombstones(merged, mergedTombstones);
  return merged;
}

// Read-merge-write sync. Fetches remote, merges with local (local wins), POSTs merged.
async function syncToCloudMerged() {
  if (!useSupabase()) {
    saveLocal();
    return;
  }
  try {
    state.syncStatus = "syncing"; render();
    let remote = {};
    try {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/pappa_tracker_data?id=eq.main&select=data`, {
        headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
      });
      const rows = await r.json();
      if (rows.length > 0 && rows[0].data) remote = rows[0].data;
    } catch(fe) { console.error("Pre-save fetch failed:", fe); /* fallback: push local as-is */ }
    state.data = mergeData(state.data, remote);
    migrateTemperatures();
    cleanDuplicates();
    saveLocal();
    await supaFetch("POST", "pappa_tracker_data", { id: "main", data: state.data });
    state.syncStatus = "ok"; render();
  } catch(e) { console.error("Sync error:", e); state.syncStatus = "error"; render(); }
}
async function syncFromCloud() {
  if (!useSupabase()) return;
  try {
    state.syncStatus = "syncing"; render();
    const r = await fetch(`${SUPABASE_URL}/rest/v1/pappa_tracker_data?id=eq.main&select=data`, {
      headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
    });
    const rows = await r.json();
    if (rows.length > 0 && rows[0].data) {
      // Merge remote into local instead of overwriting, so unsaved local edits survive.
      state.data = mergeData(state.data, rows[0].data);
      migrateTemperatures();
      cleanDuplicates();
      saveLocal();
    }
    state.syncStatus = "ok"; render();
  } catch(e) { console.error("Load cloud error:", e); state.syncStatus = "error"; render(); }
}
async function saveData() {
  cleanupTombstones();
  saveLocal();

}
function migrateTemperatures() {
  for(const key in state.data) {
    if(key==='doseOverrides' || key==='_tombstones' || key==='customTherapies' || key==='hiddenTherapies' || key==='therapyEnds' || key==='therapySkips' || key==='goals') continue;
    const day = state.data[key];
    if (!day || typeof day !== 'object' || Array.isArray(day)) continue;
    for(const bn in day) {
      const bd=day[bn];
      if (!bd || typeof bd !== 'object') continue;
      if(bd.temperature && !Array.isArray(bd.temperature)) {
        bd.temperatures=[bd.temperature];
        delete bd.temperature;
      }
    }
  }
}

function getBabyDay(bn, dateKey) {
  const bd = state.data[dateKey]?.[bn];
  const feeds = bd?.feeds || [], diapers = bd?.diapers || [], checks = bd?.therapies || {}, ts = getActiveTherapies(bn, dateKey);
  return { feeds, diapers, checks, therapies: ts, totalMl: feeds.reduce((s,f)=>s+(f.ml||0),0), totalDiapers: diapers.length, therapyDone: ts.filter(t=>checks[t.id]).length };
}
function getCalDays(y, mo) {
  const first = new Date(y, mo, 1), last = new Date(y, mo+1, 0);
  let start = first.getDay()-1; if(start<0) start=6;
  const days = [];
  for(let i=0;i<start;i++) days.push({date:new Date(y,mo,-start+i+1),cur:false});
  for(let i=1;i<=last.getDate();i++) days.push({date:new Date(y,mo,i),cur:true});
  while(days.length%7){const n=days.length-start-last.getDate()+1;days.push({date:new Date(y,mo+1,n),cur:false});}
  return days;
}
// Mon-Sun week (Italian) containing the given date.
function getWeekDays(d) {
  const dow = (d.getDay()+6)%7; // 0=Mon .. 6=Sun
  const mon = new Date(d.getFullYear(), d.getMonth(), d.getDate()-dow);
  const days = [];
  for(let i=0;i<7;i++) days.push({date:new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i),cur:true});
  return days;
}
function hasData(d) {
  const dd=state.data[dk(d)]; if(!dd) return {};
  return { feed:BABIES.some(b=>dd[b]?.feeds?.length>0), diaper:BABIES.some(b=>dd[b]?.diapers?.length>0), therapy:BABIES.some(b=>dd[b]?.therapies&&Object.values(dd[b].therapies).some(v=>v)) };
}
function getLastFeedAgo(bn) {
  const now = new Date();
  const todayKey = dk(now);
  const yesterdayKey = dk(new Date(now.getFullYear(), now.getMonth(), now.getDate()-1));
  for (const dateKey of [todayKey, yesterdayKey]) {
    const feeds = state.data[dateKey]?.[bn]?.feeds;
    if (feeds && feeds.length) {
      const lastFeed = feeds[feeds.length - 1];
      const [hh, mm] = lastFeed.time.split(':').map(Number);
      const feedDate = new Date(parseInt(dateKey.split('-')[0]), parseInt(dateKey.split('-')[1])-1, parseInt(dateKey.split('-')[2]), hh, mm);
      const diffMs = now - feedDate;
      const diffH = Math.floor(diffMs / 3600000);
      const diffM = Math.floor((diffMs % 3600000) / 60000);
      const color = diffH < 3 ? '#10B981' : diffH < 4 ? '#F59E0B' : '#EF4444';
      const text = diffH > 0 ? `${diffH}h ${diffM}min fa` : `${diffM}min fa`;
      return { text, color };
    }
  }
  return { text: 'Nessuna recente', color: '#aaa' };
}

async function delEntry(idx) {
  const key=dk(state.selDate), sec=state.tab==="feed"?"feeds":"diapers";
  const arr = state.data[key]?.[state.baby]?.[sec];

// Compact Italian date for the last weigh-in, e.g. "18 giu" (year appended only when not current).
function fmtNiceDate(ymd) {
  const [y,m,d] = ymd.split('-').map(Number);
  return d + ' ' + MONTHS[m-1].slice(0,3).toLowerCase() + (y !== new Date().getFullYear() ? ' ' + y : '');
}
// Gain between the latest weigh-in and an earlier reference one. Looks back up to
// maxDays from the LAST weigh-in and takes the oldest weigh-in inside that window
// (so the interval is the largest available, capped at maxDays); if none falls in
// the window, falls back to the immediately preceding weigh-in so the card is never
// empty. Returns {delta, days, from, to} where days is the real interval between
// the two weigh-ins and from/to are their dates. Returns null when <2 weigh-ins.
function weightDeltaDays(bn, maxDays) {
  const hist = getWeightHistory(bn);
  if (hist.length < 2) return null;
  const last = hist[hist.length-1];
  const [ly,lm,ld] = last.date.split('-').map(Number);
  const lastDate = new Date(ly, lm-1, ld);
  const cutKey = dk(new Date(ly, lm-1, ld-maxDays));
  let ref = null;
  for (const p of hist) { if (p.date >= cutKey && p.date < last.date) { ref = p; break; } }
  if (!ref) ref = hist[hist.length-2];
  const [ry,rm,rd] = ref.date.split('-').map(Number);
  const days = Math.round((lastDate - new Date(ry, rm-1, rd)) / 86400000);
  return { delta: +(last.kg - ref.kg).toFixed(2), days, from: ref.date, to: last.date };
}
// Delta between the last two consecutive weigh-ins (no window constraint).
function weightDeltaLast(bn) {
  const hist = getWeightHistory(bn);
  if (hist.length < 2) return null;
  const last = hist[hist.length-1], ref = hist[hist.length-2];
  const [ly,lm,ld]=last.date.split('-').map(Number), [ry,rm,rd]=ref.date.split('-').map(Number);
  const days = Math.round((new Date(ly,lm-1,ld)-new Date(ry,rm-1,rd))/86400000);
  return { delta: +(last.kg - ref.kg).toFixed(2), days, from: ref.date, to: last.date };
}
// "1 giorno" / "N giorni"
function dayLabel(n) { return n + (n===1 ? ' giorno' : ' giorni'); }
// Compact Italian date range, e.g. "11–15 giu" (month collapsed when shared; year only when not current).
function fmtRange(from, to) {
  const [fy,fm,fd] = from.split('-').map(Number);
  const [ty,tm,td] = to.split('-').map(Number);
  const yNow = new Date().getFullYear();
  const mon = m => MONTHS[m-1].slice(0,3).toLowerCase();
  if (fy===ty && fm===tm) return fd+'–'+td+' '+mon(tm)+(ty!==yNow?' '+ty:'');
  return fd+' '+mon(fm)+(fy!==yNow?' '+fy:'')+' – '+td+' '+mon(tm)+(ty!==yNow?' '+ty:'');
}

function avgDailyMl(bn){
  const now=new Date(); let tot=0, days=0;
  for(let i=1;i<=7;i++){
    const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);
    const f=state.data[dk(d)]?.[bn]?.feeds||[];
    if(f.length){ tot+=f.reduce((s,x)=>s+(x.ml||0),0); days++; }
  }
  return days?Math.round(tot/days):0;
}
function avgDailyFeeds(bn){
  const now=new Date(); let tot=0, days=0;
  for(let i=1;i<=7;i++){
    const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);
    const f=state.data[dk(d)]?.[bn]?.feeds||[];
    if(f.length){ tot+=f.length; days++; }

  return days?tot/days:0;

    <button onclick="state.selDate=new Date(${sy},${sm},${sday-1});render()" style="border:none;width:30px;height:30px;border-radius:10px;background:var(--glass-2);color:var(--txt);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit">‹</button>

    <button onclick="state.selDate=new Date(${sy},${sm},${sday+1});render()" style="border:none;width:30px;height:30px;border-radius:10px;background:var(--glass-2);color:var(--txt);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit">›</button>
  </div>`;
  h+=`<div class="goal-grid">`;
  BABIES.forEach(bn=>{
    const col=COLORS[bn];
    const feeds=state.data[key]?.[bn]?.feeds||[];
    const done=feeds.length;
    const dailyTarget=avgDailyMl(bn);                    // media giornaliera prefissata (obiettivo del giorno)
    const consumedSoFar=feeds.reduce((s,x)=>s+(x.ml||0),0);
    const remainingSlots=Math.max(0, n-done);
    // Ricalcolo quantità: il residuo per arrivare all'obiettivo diviso i pasti rimasti (multipli di 5).
    const remainingPer=(dailyTarget>0 && remainingSlots>0)?Math.max(0,Math.round((dailyTarget-consumedSoFar)/remainingSlots/5)*5):0;
    const anchor=done>0?feeds[done-1].time:null;
    const anchorMin=anchor?(parseInt(anchor.split(':')[0])*60+parseInt(anchor.split(':')[1])):null;
    h+=`<div><div class="goal-col-head" style="color:${col.pri}">${bn}</div>`;
    for(let j=1;j<=n;j++){
      if(j<=done){
        const f=feeds[j-1];
        const hasLeft=f.planned&&f.leftover>0;
        const hasMore=f.planned&&f.extra>0;
        const cls=hasLeft?'leftover':'done';
        const mlCol=hasLeft?'var(--red)':col.pri;
        const badge=hasLeft?`<div class="goal-left-badge">avanzati ${f.leftover} ml</div>`
                  :hasMore?`<div class="goal-more-badge">+${f.extra} ml in più</div>`:'';
        h+=`<div class="goal-slot ${cls}" style="--slotcol:${col.pri}" onclick="editPlannedSlot('${bn}',${j-1})">
          <div class="goal-slot-idx"><span class="${hasLeft?'goal-warn':'goal-check'}">${hasLeft?'⚠':'✓'}</span>${j}° pasto</div>
          <div class="goal-slot-main"><span class="goal-slot-time">${f.time}</span><span class="goal-slot-ml" style="color:${mlCol}">${f.ml} ml</span></div>
          ${badge}
        </div>`;
      } else {
        const isNext=(j===done+1);
        // Orari ancorati all'ultimo pasto consumato; i rimanenti si distribuiscono così che
        // l'ULTIMO cada esattamente all'orario impostato (lastMeal) e niente dopo.
        let timeHtml='';
        if(anchorMin!=null){
          let raw;
          if(j===n){ raw=lastMealMin; }                          // l'ultimo pasto è esattamente all'orario scelto
          else {
            const remaining=n-done;
            const step=(lastMealMin>anchorMin && remaining>0)?(lastMealMin-anchorMin)/remaining:0;
            raw=Math.min(Math.round((anchorMin+step*(j-done))/15)*15, lastMealMin);
          }
          timeHtml=`<span class="goal-slot-time" style="opacity:.7;font-weight:600">${ft(Math.floor(raw/60),raw%60)}</span>`;
        }
        const qLabel=dailyTarget>0?`≈ ${remainingPer} ml`:'imposta media';
        h+=`<div class="goal-slot pending${isNext?' next':''}" style="--slotcol:${col.pri}" onclick="openGoalMeal('${bn}',${j},${remainingPer})">
          <div class="goal-slot-idx">${j}° pasto${isNext?' · prossimo':''}</div>
          <div class="goal-slot-main">${timeHtml}<span class="goal-slot-ml" style="color:${col.pri}">${qLabel}</span></div>
        </div>`;
      }
    }
    const goalTot=dailyTarget>0?`${dailyTarget} ml`:'—';
    const extra=done>n?` · +${done-n} extra`:'';
    h+=`<div class="goal-summary">Fatti ${Math.min(done,n)}/${n}${extra}<br>${consumedSoFar} ml / obiettivo ${goalTot}</div>`;
    h+=`</div>`;
  });
  h+=`</div>`; // goal-grid
  h+=`</div></div>`; // cal + content sezione B
  return h;
}

  if (r === 'mobile') {
    startKey = weightChartState.mobileFrom;
    endKey = weightChartState.mobileTo;
    if (startKey && endKey) {
      const [sy,sm,sd]=startKey.split('-'), [ey,em,ed]=endKey.split('-');
      navLabel = `${parseInt(sd,10)}/${parseInt(sm,10)} — ${parseInt(ed,10)}/${parseInt(em,10)}`;
    }
  } else if (r === '30') {
    const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() - off*30);
    const start = new Date(end.getFullYear(), end.getMonth(), end.getDate() - 29);
    startKey = dk(start); endKey = dk(end);
    navLabel = `${start.getDate()}/${start.getMonth()+1} — ${end.getDate()}/${end.getMonth()+1}`;
  } else if (r === '60') {
    const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() - off*60);
    const start = new Date(end.getFullYear(), end.getMonth(), end.getDate() - 59);
    startKey = dk(start); endKey = dk(end);
    navLabel = `${start.getDate()}/${start.getMonth()+1} — ${end.getDate()}/${end.getMonth()+1}`;
  } else if (r === '90') {
    const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() - off*90);
    const start = new Date(end.getFullYear(), end.getMonth(), end.getDate() - 89);
    startKey = dk(start); endKey = dk(end);
    navLabel = `${start.getDate()}/${start.getMonth()+1} — ${end.getDate()}/${end.getMonth()+1}`;
  }
  const inRange = (p) => (!startKey || p.date >= startKey) && (!endKey || p.date <= endKey);
  const gData = r === 'max' ? gDataAll : gDataAll.filter(inRange);
  const vData = r === 'max' ? vDataAll : vDataAll.filter(inRange);
  // Nav row: rolling-window filters (30/60/90); Mobile and Max have no arrows.
  const navHtml = (r === '30' || r === '60' || r === '90') ? `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px"><button onclick="event.stopPropagation();navWeightChart(1)" style="border:none;width:32px;height:32px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:16px;font-weight:700;cursor:pointer;font-family:inherit">‹</button><span style="font-size:13px;font-weight:700;color:var(--txt)">${navLabel}</span><button onclick="event.stopPropagation();navWeightChart(-1)" style="border:none;width:32px;height:32px;border-radius:10px;background:${off===0?'var(--glass-2)':'var(--accent-soft)'};color:${off===0?'var(--hint)':'var(--accent)'};font-size:16px;font-weight:700;cursor:pointer;font-family:inherit"${off===0?' disabled':''}>›</button></div>` : '';
  // Range toolbar — Mobile replaces 7g; 60g added between 30g and 90g.
  const ranges = [{k:'mobile',l:'Mobile'},{k:'30',l:'30g'},{k:'60',l:'60g'},{k:'90',l:'90g'},{k:'max',l:'Max'}];
  const mobilePicker = r === 'mobile' ? buildMobilePicker() : '';
  const toolbar = `${navHtml}<div class="weight-range-row">${ranges.map(rr => `<button class="weight-range-btn${r===rr.k?' active':''}" onclick="event.stopPropagation();setWeightRange('${rr.k}')">${rr.l}</button>`).join('')}</div>${mobilePicker}`;
  const legend = `<div class="weight-legend"><div class="weight-legend-item"><div class="weight-legend-dot" style="background:${COLORS.Gabriel.pri}"></div>Gabriel</div><div class="weight-legend-item"><div class="weight-legend-dot" style="background:${COLORS.Vittorio.pri}"></div>Vittorio</div></div>`;
  // Delta (only for 7/30/90)
  let deltaHtml = '';
  if (r !== 'max') {
    function deltaLine(data, color, name) {
      if (data.length < 2) return '';
      const first = data[0], last = data[data.length-1];
      const diff = +(last.kg - first.kg).toFixed(2);
      const sign = diff > 0 ? '+' : '';
      const fmt = (n) => String(n).replace('.', ',');
      return `<div style="font-size:11px;color:#555"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${color};margin-right:5px"></span><b>${name}</b>: ${fmt(first.kg)} → ${fmt(last.kg)} kg <b style="color:${diff>=0?'#10B981':'#EF4444'}">(${sign}${fmt(diff)})</b></div>`;
    }
    const gLine = deltaLine(gData, COLORS.Gabriel.pri, 'Gabriel');
    const vLine = deltaLine(vData, COLORS.Vittorio.pri, 'Vittorio');
    if (gLine || vLine) {
      const deltaLabel = r==='mobile' ? 'intervallo selezionato'
        : r==='30' ? '30 giorni'
        : r==='60' ? '60 giorni'
        : '90 giorni';
      deltaHtml = `<div style="margin-top:10px;padding:8px 10px;background:#f5f5fa;border-radius:10px"><div style="font-size:10px;color:#888;font-weight:700;margin-bottom:4px">Δ PESO (${deltaLabel})</div>${gLine}${vLine}</div>`;
    }
  }
  const footer = inline ? '' : `<div style="margin-top:10px"><button class="btn-cancel" style="width:100%" onclick="closeModal()">Chiudi</button></div>`;
  // Empty state
  if (!gData.length && !vData.length) {
    return `${toolbar}<div style="padding:40px 10px;text-align:center;color:#999;font-size:12px">Nessuna pesata nell'intervallo selezionato.</div>${legend}${footer}`;
  }
  // Collect all dates in filtered range
  const allDates=[...new Set([...gData.map(p=>p.date),...vData.map(p=>p.date)])].sort();
  const allKg=[...gData.map(p=>p.kg),...vData.map(p=>p.kg)];
  const minKg=Math.floor(Math.min(...allKg)*10)/10-0.2, maxKg=Math.ceil(Math.max(...allKg)*10)/10+0.2;
  const H=260, pad={t:25,r:15,b:40,l:40};
  const W = r==='max' ? Math.max(420, 25*allDates.length+pad.l+pad.r) : 420;
  const cw=W-pad.l-pad.r, ch=H-pad.t-pad.b;
  const xOf = (i) => pad.l+(i/(allDates.length-1||1))*cw;
  const yOf = (kg) => pad.t+ch-(((kg-minKg)/(maxKg-minKg||1))*ch);
  const svgStyle = r==='max' ? `style="min-width:${W}px"` : '';
  let svg=`<svg viewBox="0 0 ${W} ${H}" class="weight-chart-canvas" ${svgStyle} xmlns="http://www.w3.org/2000/svg">`;
  svg+=`<rect x="0" y="0" width="${W}" height="${H}" fill="transparent" onclick="event.stopPropagation();closeWeightTooltip()"/>`;
  const steps=5;
  for(let i=0;i<=steps;i++){
    const val=minKg+((maxKg-minKg)/steps)*i, yy=yOf(val);
    svg+=`<line x1="${pad.l}" y1="${yy}" x2="${W-pad.r}" y2="${yy}" stroke="#eee" stroke-width="1"/>`;
    svg+=`<text x="${pad.l-5}" y="${yy+3}" text-anchor="end" font-size="8" fill="#aaa" font-family="Nunito">${val.toFixed(1)}</text>`;
  }
  const maxLabels = r==='max' ? allDates.length : Math.min(allDates.length,7);
  const labelStep=Math.max(1,Math.floor(allDates.length/maxLabels));
  allDates.forEach((d,i)=>{
    if(i%labelStep===0||i===allDates.length-1){
      const parts=d.split('-');
      svg+=`<text x="${xOf(i)}" y="${H-pad.b+18}" text-anchor="middle" font-size="8" fill="#aaa" font-family="Nunito">${parts[2]}/${parts[1]}</text>`;
    }
  });
  const gPosByDate = {}; gData.forEach(p => { gPosByDate[p.date] = p.kg; });
  const vPosByDate = {}; vData.forEach(p => { vPosByDate[p.date] = p.kg; });
  function drawLine(data, color, bn){
    if(data.length<1) return '';
    let path='', circles='';
    data.forEach((p) => {
      const i=allDates.indexOf(p.date), px=xOf(i), py=yOf(p.kg);
      if(!path) path=`M${px},${py}`; else path+=` L${px},${py}`;
      circles+=`<circle cx="${px}" cy="${py}" r="6" fill="${color}" stroke="#fff" stroke-width="2" style="cursor:pointer" onclick="event.stopPropagation();pickWeightPoint('${bn}','${p.date}',${p.kg},${px},${py})"/>`;
      const otherKg = bn === 'Gabriel' ? vPosByDate[p.date] : gPosByDate[p.date];
      let labelY;
      if (otherKg !== undefined) {
        labelY = p.kg >= otherKg ? py - 10 : py + 15;
      } else {
        labelY = py - 10;
      }
      circles+=`<text x="${px}" y="${labelY}" text-anchor="middle" font-size="8" fill="${color}" font-weight="700" font-family="Nunito" style="pointer-events:none">${p.kg}</text>`;
    });
    return `<path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${circles}`;
  }
  svg+=drawLine(gData, COLORS.Gabriel.pri, 'Gabriel');
  svg+=drawLine(vData, COLORS.Vittorio.pri, 'Vittorio');
  svg+=`<g id="weight-tooltip" style="pointer-events:none"></g>`;
  svg+=`</svg>`;
  const chartHtml = r==='max' ? `<div class="weight-chart-scroll">${svg}</div>` : svg;
  return `${toolbar}${chartHtml}${legend}${inline?'':deltaHtml}${footer}`;
}
// Range/Mobile changes update the inline Andamenti chart by re-rendering the page.
function setWeightRange(range) {
  if (range !== undefined) {
    if (weightChartState.range !== range) weightChartState.offset = 0;
    weightChartState.range = range;
  }
  // Initialize Mobile range defaults (first time the user picks Mobile)
  if (weightChartState.range === 'mobile' &&
      (!weightChartState.mobileFrom || !weightChartState.mobileTo)) {
    const u = getWeightDateUniverse();
    if (u.sorted.length) {
      weightChartState.mobileFrom = u.sorted[0];
      weightChartState.mobileTo = u.sorted[u.sorted.length - 1];
    }
  }
  render();
}
// ─── PEDIATRIC REPORT ───
const BIRTH_DATE = new Date(2025, 11, 8);
function showPediatricReport() {
  let reportBaby = state.baby;
  function buildReport(bn) {
    const c = COLORS[bn];
    const today = new Date();
    // Age calculation
    const ageMs = today - BIRTH_DATE;
    const ageDays = Math.floor(ageMs / 86400000);
    const ageMonths = Math.floor(ageDays / 30.44);
    const ageRemDays = Math.floor(ageDays - ageMonths * 30.44);
    const ageStr = ageMonths > 0 ? `${ageMonths} mesi e ${ageRemDays} giorni` : `${ageDays} giorni`;
    // Collect last 7 days
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      days.push(dk(d));
    }
    const daysWithData = days.filter(k => state.data[k]?.[bn]);
    const numDays = daysWithData.length || 1;
    // Feeds
    let totalMl = 0, totalFeeds = 0, formulaCount = 0, maternoCount = 0;
    days.forEach(k => {
      const feeds = state.data[k]?.[bn]?.feeds || [];
      totalFeeds += feeds.length;
      feeds.forEach(f => {
        totalMl += f.ml || 0;
        if (f.type === "Formula") formulaCount++; else maternoCount++;
      });
    });
    const avgMl = numDays ? Math.round(totalMl / numDays) : 0;
    const avgFeeds = numDays ? (totalFeeds / numDays).toFixed(1) : "0";
    const prevalente = formulaCount >= maternoCount ? "Formula" : "Materno";
    // Diapers
    let totalDiapers = 0;
    days.forEach(k => { totalDiapers += (state.data[k]?.[bn]?.diapers || []).length; });
    const avgDiapers = numDays ? (totalDiapers / numDays).toFixed(1) : "0";
    // Weight
    let lastWeight = null, firstWeight = null;
    days.forEach(k => {
      const w = state.data[k]?.[bn]?.weight;
      if (w) { if (!firstWeight) firstWeight = w.kg; lastWeight = w.kg; }
    });
    // If no weight in period, get most recent from all history
    if (!lastWeight) {
      const hist = getWeightHistory(bn);
      if (hist.length) lastWeight = hist[hist.length - 1].kg;
    }
    const weightVar = (firstWeight && lastWeight) ? (lastWeight - firstWeight).toFixed(2) : null;
    // Temperature
    let lastTemp = null;
    days.forEach(k => {
      const temps = state.data[k]?.[bn]?.temperatures||[];
      if (temps.length) lastTemp = temps[temps.length-1];
    });
    // Therapy compliance — per day, only therapies active on that day count.
    const therapies = getTherapies(bn);
    let therapyTotal = 0, therapyDone = 0;
    days.forEach(k => {
      const act = getActiveTherapies(bn, k);
      if (!act.length) return;
      therapyTotal++;
      const checks = state.data[k]?.[bn]?.therapies || {};
      if (act.every(t => checks[t.id])) therapyDone++;
    });
    const compliance = therapyTotal ? Math.round((therapyDone / therapyTotal) * 100) : null;
    // Period label
    const startDate = days[0].split('-').reverse().join('/');
    const endDate = days[days.length - 1].split('-').reverse().join('/');
    return `
      <div style="padding:4px 0 12px;">
        <div style="text-align:center;margin-bottom:16px;">
          <div style="font-size:18px;font-weight:800;color:${c.acc}">Report per il Pediatra</div>
          <div style="font-size:11px;color:#888;margin-top:2px">Periodo: ${startDate} — ${endDate} (7 giorni)</div>
          <div style="font-size:11px;color:#888">Generato il ${new Date().toLocaleDateString('it-IT')}</div>
        </div>
        <div style="background:${c.light};border-radius:12px;padding:10px 12px;margin-bottom:14px;">
          <div style="font-size:14px;font-weight:800;color:${c.acc}">👶🏻 ${bn}</div>
          <div style="font-size:11px;color:#666;margin-top:2px">Età: ${ageStr} (nato l'8 dicembre 2025)</div>
        </div>
        <div class="report-section">
          <h3 style="color:${c.acc}">🍼 Alimentazione</h3>
          <div class="report-stat"><span class="label">Media ml/giorno</span><span class="value">${avgMl} ml</span></div>
          <div class="report-stat"><span class="label">Media poppate/giorno</span><span class="value">${avgFeeds}</span></div>
          <div class="report-stat"><span class="label">Tipo prevalente</span><span class="value">${prevalente}</span></div>
          <div class="report-stat"><span class="label">Totale nel periodo</span><span class="value">${totalMl} ml (${totalFeeds} poppate)</span></div>
        </div>
        <div class="report-section">
          <h3 style="color:${c.acc}">💩 Pannolini</h3>
          <div class="report-stat"><span class="label">Media/giorno</span><span class="value">${avgDiapers}</span></div>
          <div class="report-stat"><span class="label">Totale nel periodo</span><span class="value">${totalDiapers}</span></div>
        </div>
        <div class="report-section">
          <h3 style="color:${c.acc}">⚖️ Peso</h3>
          <div class="report-stat"><span class="label">Ultimo peso</span><span class="value">${lastWeight ? lastWeight + ' kg' : '—'}</span></div>
          ${weightVar !== null ? `<div class="report-stat"><span class="label">Variazione nel periodo</span><span class="value ${parseFloat(weightVar) >= 0 ? 'report-ok' : 'report-flag'}">${parseFloat(weightVar) >= 0 ? '+' : ''}${weightVar} kg</span></div>` : ''}
        </div>
        <div class="report-section">
          <h3 style="color:${c.acc}">🌡️ Temperatura</h3>
          ${lastTemp ? `<div class="report-stat"><span class="label">Ultima registrata</span><span class="value">${lastTemp}°C</span></div>
          ${parseFloat(lastTemp) > 37.5 ? '<div class="report-flag">⚠️ Sopra 37.5°C</div>' : '<div class="report-ok">✓ Nella norma</div>'}` : '<div style="font-size:11px;color:#aaa">Nessun dato registrato</div>'}
        </div>
        <div class="report-section">
          <h3 style="color:${c.acc}">💊 Terapie</h3>
          ${therapies.length ? `
            <div class="report-stat"><span class="label">Compliance</span><span class="value ${compliance >= 80 ? 'report-ok' : compliance >= 50 ? '' : 'report-flag'}">${compliance}%</span></div>
            <div style="font-size:10px;color:#888;margin-top:4px">(giorni con tutte le terapie somministrate / giorni totali)</div>
            <div style="margin-top:6px">${therapies.map(t => { const ed = therapyEndDate(t, bn); return ed ? `<div style="font-size:11px;padding:2px 0;color:#aaa">${t.icon} ${t.name} — ${t.dose} <i>(somministrato l'ultimo giorno in data ${fmtDotDate(ed)})</i></div>` : `<div style="font-size:11px;padding:2px 0">${t.icon} ${t.name} — ${t.dose}</div>`; }).join('')}</div>
          ` : '<div style="font-size:11px;color:#aaa">Nessuna terapia configurata</div>'}
        </div>
      </div>`;
  }
  function renderReport() {
    const c = COLORS[reportBaby];
    setModal(`<div class="modal-bg" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()">
      <div class="modal-handle"></div>
      <div style="display:flex;gap:6px;margin-bottom:12px">${BABIES.map(b => `<button class="pill ${reportBaby === b ? 'on' : 'off'}" style="${reportBaby === b ? 'color:' + COLORS[b].acc : 'background:' + COLORS[b].light + ';color:' + COLORS[b].acc}" data-baby="${b}">👶🏻 ${b}</button>`).join('')}</div>
      <div id="report-content">${buildReport(reportBaby)}</div>
      <div class="form-actions">
        <button class="btn-cancel" onclick="closeModal()">Chiudi</button>
        <button class="btn-save" style="background:${c.grad}" onclick="window.print()">🖨️ Stampa</button>
      </div>
    </div></div>`);
    // Attach pill switching via event delegation
    document.querySelectorAll('.modal .pill').forEach(btn => {
      btn.onclick = function(e) {
        e.stopPropagation();
        reportBaby = this.dataset.baby;
        renderReport();
      };
    });
  }
  renderReport();
}

  const key = dk(state.selDate);
  if (!state.data.therapySkips) state.data.therapySkips = {};
  if (!state.data.therapySkips[bn]) state.data.therapySkips[bn] = {};
  if (!state.data.therapySkips[bn][tid]) state.data.therapySkips[bn][tid] = [];
  if (!state.data.therapySkips[bn][tid].includes(key)) state.data.therapySkips[bn][tid].push(key);
  // Also clear any tick recorded that day so it doesn't count.
  if (state.data[key]?.[bn]?.therapies) delete state.data[key][bn].therapies[tid];
  await saveData(); closeModal(); render();
}
// End the therapy from the viewed day onward (last administered = day before).
async function endTherapyFromDay(bn, tid) {
  const key = dk(state.selDate);
  if (!state.data.therapyEnds) state.data.therapyEnds = {};
  if (!state.data.therapyEnds[bn]) state.data.therapyEnds[bn] = {};
  state.data.therapyEnds[bn][tid] = dayBeforeKey(key);
  await saveData(); closeModal(); render();
}
// Undo an end (reactivate from the viewed day): clears the end override.
async function restoreTherapy(bn, tid) {
  if (!state.data.therapyEnds) state.data.therapyEnds = {};
  if (!state.data.therapyEnds[bn]) state.data.therapyEnds[bn] = {};
  state.data.therapyEnds[bn][tid] = ""; // "" clears the end (even a hardcoded one)
  await saveData(); render();
}
// Undo a single-day skip for the viewed day.
async function unskipTherapyDay(bn, tid) {
  const key = dk(state.selDate);
  const arr = state.data.therapySkips?.[bn]?.[tid];
  if (arr) state.data.therapySkips[bn][tid] = arr.filter(d => d !== key);
  await saveData(); render();
}
// ─── TOAST ───
function showToast(msg) {
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg || '✅ Salvato!';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
// ─── TEMPERATURE ───
function openTempModal(bn, idx) {
  state._editTempIdx = idx !== undefined ? idx : null;
  const c=COLORS[bn], n=new Date(), h=n.getHours(), m=n.getMinutes();
  const mins=[0,15,30,45], nearM=mins.reduce((a,b)=>Math.abs(b-m)<Math.abs(a-m)?b:a);
  const key=dk(state.selDate), existing = idx !== undefined ? (state.data[key]?.[bn]?.temperatures||[])[idx] : null;
  const selH = existing ? parseInt(existing.time.split(":")[0]) : h;
  const selM = existing ? parseInt(existing.time.split(":")[1]) : nearM;
  const hO=Array.from({length:24},(_,i)=>`<option value="${i}"${i===selH?' selected':''}>${String(i).padStart(2,'0')}</option>`).join("");
  const mO=mins.map(i=>`<option value="${i}"${i===selM?' selected':''}>${String(i).padStart(2,'0')}</option>`).join("");
  const tVal=existing?String(existing.temp).replace('.',','):'', tNote=existing?.note||'';
  const med=existing?.medicine||{};
  const hasMed=med.name?'checked':'';
  setModal(`<div class="modal-bg" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><div class="modal-handle"></div><div class="modal-title" style="color:${c.acc}">${existing?'Modifica':'Aggiungi'} temperatura — ${bn}</div><div class="form-label">Ora</div><div class="form-row"><select class="form-select" id="f-h">${hO}</select><span style="font-size:18px;font-weight:800;color:#999">:</span><select class="form-select" id="f-m">${mO}</select></div><div class="form-label">Temperatura (°C)</div><input class="form-input big" type="text" inputmode="decimal" id="t-val" value="${tVal}" placeholder="es. 37,5" style="margin-bottom:12px"><div class="form-label">Note (opzionale)</div><input class="form-input" id="t-note" value="${tNote}" placeholder="es. dopo il bagnetto..." style="margin-bottom:12px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;cursor:pointer" onclick="const c=document.getElementById('t-med-check');c.checked=!c.checked;document.getElementById('t-med-fields').style.display=c.checked?'block':'none'"><input type="checkbox" id="t-med-check" ${hasMed} style="width:16px;height:16px;cursor:pointer" onclick="event.stopPropagation();document.getElementById('t-med-fields').style.display=this.checked?'block':'none'"><span style="font-size:12px;font-weight:700">💊 Somministrato farmaco</span></div><div id="t-med-fields" style="display:${hasMed?'block':'none'};margin-bottom:12px"><div class="form-label">Nome farmaco</div><input class="form-input" id="t-med-name" value="${med.name||''}" placeholder="es. Tachipirina" style="margin-bottom:8px"><div class="form-label">Dosaggio</div><input class="form-input" id="t-med-dose" value="${med.dose||''}" placeholder="es. 5 gocce" style="margin-bottom:4px"></div><div class="form-actions"><button class="btn-cancel" onclick="closeModal()">Annulla</button><button class="btn-save" style="background:${c.grad}" onclick="submitTemp('${bn}')">${existing?'Salva':'Aggiungi'} 🌡️</button></div></div></div>`);
}
async function submitTemp(bn) {
  const temp=parseFloat(document.getElementById("t-val").value.replace(",","."));
  if(!temp||isNaN(temp)||temp<35||temp>42) return;
  const h=parseInt(document.getElementById("f-h").value), m=parseInt(document.getElementById("f-m").value);
  const key=dk(state.selDate);
  if(!state.data[key]) state.data[key]={};
  if(!state.data[key][bn]) state.data[key][bn]={};
  if(!state.data[key][bn].temperatures) state.data[key][bn].temperatures=[];
  const entry={temp, time:ft(h,m), note:document.getElementById("t-note").value.trim()};
  const medName=document.getElementById("t-med-name").value.trim();
  if(document.getElementById("t-med-check").checked && medName) {
    entry.medicine={name:medName, dose:document.getElementById("t-med-dose").value.trim()};
  }
  if(state._editTempIdx!==null&&state._editTempIdx!==undefined) {
    const existing = state.data[key][bn].temperatures[state._editTempIdx];
    entry.id = existing && existing.id ? existing.id : uid();
    state.data[key][bn].temperatures[state._editTempIdx]=entry;
  } else {
    if (!entry.id) entry.id = uid();
    state.data[key][bn].temperatures.push(entry);
  }
  state.data[key][bn].temperatures.sort((a,b)=>a.time.localeCompare(b.time));
  await saveData(); closeModal(); render();
}
async function delTemp(bn, idx) {
  const key=dk(state.selDate);
  const temps=state.data[key]?.[bn]?.temperatures;
  if(temps && temps[idx]!==undefined) {
    const removed = temps[idx];
    if (removed && !removed.id) removed.id = uid();
    if (removed) addTombstone({ kind: 'temperatures', dateKey: key, baby: bn, id: removed.id });
    temps.splice(idx,1);
    if(!temps.length) delete state.data[key][bn].temperatures;
    if(state.data[key][bn]&&!Object.keys(state.data[key][bn]).length) delete state.data[key][bn];
    if(state.data[key]&&!Object.keys(state.data[key]).length) delete state.data[key];
    await saveData(); render();
  }
}
function tempColor(t) { return t < 37.5 ? '#10B981' : t <= 38.5 ? '#F59E0B' : '#EF4444'; }
// ─── WEEKLY SUMMARY ───
let weeklyOffset = 0;
function navWeeklySummary(delta) {
  weeklyOffset += delta;
  if (weeklyOffset < 0) weeklyOffset = 0;
  renderWeeklySummary();
}
// Build inner HTML pieces (label, table rows + averages, prev/next button states)
function buildWeeklySummaryParts(bn) {
  bn = bn || state.baby;
  const c=COLORS[bn], now=new Date();
  const todayDow=(now.getDay()+6)%7;
  const monThisWeek=new Date(now.getFullYear(),now.getMonth(),now.getDate()-todayDow);
  const startDate=new Date(monThisWeek.getFullYear(),monThisWeek.getMonth(),monThisWeek.getDate()-weeklyOffset*7);
  const endDate=new Date(startDate.getFullYear(),startDate.getMonth(),startDate.getDate()+6);
  const label=`${startDate.getDate()}/${startDate.getMonth()+1} — ${endDate.getDate()}/${endDate.getMonth()+1}`;
  const todayKey=dk(now);
  let rows='';
  let totMl=0,totFeeds=0,totDiapers=0,days=0;
  for(let i=0;i<7;i++){
    const d=new Date(startDate.getFullYear(),startDate.getMonth(),startDate.getDate()+i);
    const key=dk(d), bd=state.data[key]?.[bn];
    const dayFeeds=bd?.feeds||[], dayDiapers=bd?.diapers||[];
    const ml=dayFeeds.reduce((s,f)=>s+(f.ml||0),0);
    const wt=bd?.weight?.kg||'—';
    const dayTemps=bd?.temperatures||[];
    const tmp=dayTemps.length?Math.max(...dayTemps.map(t=>t.temp)):'—';
    const dayName=DAYNAMES[(d.getDay()+6)%7];
    const hasData=dayFeeds.length||dayDiapers.length||bd?.weight||dayTemps.length;
    const isPast=key<todayKey;
    if(isPast && hasData) days++;
    if(isPast) { totMl+=ml; totFeeds+=dayFeeds.length; totDiapers+=dayDiapers.length; }
    rows+=`<tr style="border-bottom:1px solid var(--border)"><td style="padding:6px 4px;font-weight:700;font-size:10px">${dayName} ${d.getDate()}/${d.getMonth()+1}</td><td style="padding:6px 4px;text-align:center;font-size:10px">${ml||'—'}</td><td style="padding:6px 4px;text-align:center;font-size:10px">${dayFeeds.length||'—'}</td><td style="padding:6px 4px;text-align:center;font-size:10px">${dayDiapers.length||'—'}</td><td style="padding:6px 4px;text-align:center;font-size:10px">${wt}</td><td style="padding:6px 4px;text-align:center;font-size:10px">${tmp}</td></tr>`;
  }
  const avgMl=days?Math.round(totMl/days):0, avgFeeds=days?(totFeeds/days).toFixed(1):0, avgDiapers=days?(totDiapers/days).toFixed(1):0;
  const isCurrentWeek=weeklyOffset===0;
  const tableInner = `<thead><tr style="border-bottom:2px solid ${c.pri}"><th style="padding:6px 4px;text-align:left;font-size:9px;color:#888">Giorno</th><th style="padding:6px 4px;text-align:center;font-size:9px;color:#888">ml</th><th style="padding:6px 4px;text-align:center;font-size:9px;color:#888">🍼</th><th style="padding:6px 4px;text-align:center;font-size:9px;color:#888">💩</th><th style="padding:6px 4px;text-align:center;font-size:9px;color:#888">kg</th><th style="padding:6px 4px;text-align:center;font-size:9px;color:#888">°C</th></tr></thead><tbody>${rows}<tr style="background:${c.light};font-weight:800"><td style="padding:6px 4px;font-size:10px">Media/gg</td><td style="padding:6px 4px;text-align:center;font-size:10px">${avgMl}</td><td style="padding:6px 4px;text-align:center;font-size:10px">${avgFeeds}</td><td style="padding:6px 4px;text-align:center;font-size:10px">${avgDiapers}</td><td style="padding:6px 4px;text-align:center;font-size:10px">—</td><td style="padding:6px 4px;text-align:center;font-size:10px">—</td></tr></tbody>`;
  return { label, tableInner, isCurrentWeek, c, bn };
}
// Update existing modal in place (no flash). Falls back to full open if modal absent.
function renderWeeklySummary() {
  const root = document.getElementById('wk-modal');
  if (!root) { showWeeklySummary(); return; }
  const parts = buildWeeklySummaryParts();
  document.getElementById('wk-label').textContent = parts.label;
  document.getElementById('wk-table').innerHTML = parts.tableInner;
  const next = document.getElementById('wk-next');
  next.disabled = parts.isCurrentWeek;
  next.style.background = parts.isCurrentWeek ? '#eee' : parts.c.light;
  next.style.color = parts.isCurrentWeek ? '#ccc' : parts.c.pri;
}
function showWeeklySummary(offset) {
  if(offset!==undefined) weeklyOffset=offset;
  const parts = buildWeeklySummaryParts();
  const c = parts.c, bn = parts.bn;
  setModal(`<div class="modal-bg" onclick="closeModal()"><div id="wk-modal" class="modal" onclick="event.stopPropagation()"><div class="modal-handle"></div><div class="modal-title" style="color:${c.acc}">📅 Settimana — ${bn}</div><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><button onclick="event.stopPropagation();navWeeklySummary(1)" style="border:none;width:32px;height:32px;border-radius:8px;background:${c.light};color:${c.pri};font-size:16px;font-weight:700;cursor:pointer;font-family:inherit">‹</button><span id="wk-label" style="font-size:12px;font-weight:800;color:#555">${parts.label}</span><button id="wk-next" onclick="event.stopPropagation();navWeeklySummary(-1)" style="border:none;width:32px;height:32px;border-radius:8px;background:${parts.isCurrentWeek?'#eee':c.light};color:${parts.isCurrentWeek?'#ccc':c.pri};font-size:16px;font-weight:700;cursor:pointer;font-family:inherit"${parts.isCurrentWeek?' disabled':''}>›</button></div><div style="overflow-x:auto"><table id="wk-table" style="width:100%;border-collapse:collapse;font-family:'Nunito',sans-serif">${parts.tableInner}</table></div><div style="margin-top:14px"><button class="btn-cancel" style="width:100%" onclick="closeModal()">Chiudi</button></div></div></div>`);
}
// ─── AUTH ───
const APP_PASSWORD = "Ebby";
const AUTH_KEY = "pappatracker_auth";
function isAuthenticated() {
  return sessionStorage.getItem(AUTH_KEY) === "true";
}
function showLockScreen() {
  document.getElementById("app").innerHTML = `<div class="lock-screen">
    <div class="lock-icon">🍼</div>
    <div class="lock-title">Pappa Tracker</div>
    <div class="lock-sub">Gabriel & Vittorio</div>
    <input class="lock-input" type="password" id="lock-pwd" placeholder="Password" onkeydown="if(event.key==='Enter')checkPassword()">
    <button class="lock-btn" onclick="checkPassword()">Accedi</button>
    <div class="lock-error" id="lock-err"></div>
  </div>`;
  document.getElementById("lock-pwd").focus();
}
function checkPassword() {
  const pwd = document.getElementById("lock-pwd").value;
  if (pwd === APP_PASSWORD) {
    sessionStorage.setItem(AUTH_KEY, "true");
    initApp();
  } else {
    document.getElementById("lock-err").textContent = "Password errata";
    document.getElementById("lock-pwd").value = "";
    document.getElementById("lock-pwd").focus();
  }
}
let supaClient = null;
let realtimeChannel = null;
function initRealtime() {
  if (!useSupabase() || !window.supabase || supaClient) return;
  try {
    supaClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    realtimeChannel = supaClient
      .channel('pappa-changes')
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'pappa_tracker_data', filter: 'id=eq.main' },
        (payload) => {
          const row = payload && (payload.new || payload.record);
          if (row && row.data) {
            state.data = mergeData(state.data, row.data);
            migrateTemperatures();
            cleanDuplicates();
            saveLocal();
            render();
          }
        })
      .subscribe();
  } catch(e) { console.error("Realtime init error:", e); }
}
let lastFocusSync = 0;
function onAppFocus() {
  if (!isAuthenticated()) return;
  // Throttle: avoid double fire (visibilitychange + focus often fire together)
  const now = Date.now();
  if (now - lastFocusSync < 1500) return;
  lastFocusSync = now;
  syncFromCloud();
}
function initApp() {
  loadLocal();
  render();
  syncFromCloud().then(() => initRealtime());
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') onAppFocus();
  });
  window.addEventListener('focus', onAppFocus);
}
// ─── INIT ───
if (isAuthenticated()) {
  initApp();
} else {
  showLockScreen();
}
</script>
