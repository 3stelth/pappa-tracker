# Tiene sveglio il progetto Supabase (piano Free): viene messo in pausa
# dopo una settimana con poca attività. La guida ufficiale chiede "alcune
# richieste al database ogni giorno": una sola richiesta ogni 3 giorni non bastava.
# Solo lettura: legge l'id della riga, non tocca i dati.
name: Supabase keepalive

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          # Chiave pubblica "publishable", già presente in index.html
          KEY: sb_publishable_jicoWcdW87NzVXFQTx3fxA_dJOv_dVe
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS --retry 3 --retry-delay 10 --retry-all-errors \
              "https://ukcwajbbybkobaroyqiq.supabase.co/rest/v1/pappa_tracker_data?select=id&limit=1" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
            echo
            sleep 5
          done
