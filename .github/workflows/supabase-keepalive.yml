# Tiene sveglio il progetto Supabase (piano Free): viene messo in pausa
# dopo 7 giorni senza attività. Solo lettura: legge l'id della riga, non tocca i dati.
name: Supabase keepalive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          # Chiave pubblica "publishable", già presente in index.html
          KEY: sb_publishable_jicoWcdW87NzVXFQTx3fxA_dJOv_dVe
        run: |
          curl -fsS "https://ukcwajbbybkobaroyqiq.supabase.co/rest/v1/pappa_tracker_data?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
