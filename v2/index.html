<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🥣 Pappa V2</title>
<!-- Icona e nome diversi dalla versione completa: sulla schermata Home le due app
     devono distinguersi a colpo d'occhio, altrimenti sono due 🍼 identici. -->
<meta name="apple-mobile-web-app-title" content="Pappa V2">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥣</text></svg>">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --gabriel-pri: #3B82F6; --gabriel-acc: #2563EB; --gabriel-light: #E8F1FE; --gabriel-2: #60A5FA;
  --vittorio-pri: #14B8A6; --vittorio-acc: #0D9488; --vittorio-light: #E2FBF6; --vittorio-2: #2DD4BF;
  --accent: #3B82F6; --accent-2: #60A5FA; --accent-acc: #2563EB;
  --grad: linear-gradient(135deg,#60A5FA,#3B82F6);
  --bg-0: #EAF0FB; --bg-1: #E2E9F6;
  --txt: #0C1222; --sub: #5C6678; --hint: #98A0B2;
  --glass: rgba(255,255,255,0.55); --glass-2: rgba(255,255,255,0.40); --glass-strong: rgba(255,255,255,0.80); --solid: #F7FAFE;
  --glass-brd: rgba(255,255,255,0.80); --glass-brd-2: rgba(255,255,255,0.45);
  --hair: rgba(12,18,34,0.09);
  --shadow: 0 12px 36px rgba(22,32,72,0.13); --shadow-sm: 0 4px 16px rgba(22,32,72,0.08);
  --green: #10B981; --green-light: rgba(16,185,129,0.15);
  --red: #F43F5E; --red-light: rgba(244,63,94,0.13);
  --amber: #F59E0B; --amber-light: rgba(245,158,11,0.16);
  --blur: 20px; --blur-strong: 30px;
  --r-lg: 26px; --r-md: 18px; --r-sm: 13px;
  --tab-h: 76px;
}
body.dark {
  --bg-0: #060812; --bg-1: #0A0E1C;
  --txt: #EAEDF7; --sub: #99A1B7; --hint: #69708A;
  --glass: rgba(26,31,52,0.52); --glass-2: rgba(22,27,46,0.40); --glass-strong: rgba(28,34,58,0.82); --solid: #1B2238;
  --glass-brd: rgba(255,255,255,0.14); --glass-brd-2: rgba(255,255,255,0.07);
  --hair: rgba(255,255,255,0.09);
  --shadow: 0 16px 44px rgba(0,0,0,0.55); --shadow-sm: 0 6px 22px rgba(0,0,0,0.42);
  --green-light: rgba(16,185,129,0.20);
  --red-light: rgba(244,63,94,0.22);
  --amber-light: rgba(245,158,11,0.24);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg-0); }
body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif; color: var(--txt); max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(var(--tab-h) + 28px); letter-spacing: -0.01em; }
b, .num { font-variant-numeric: tabular-nums; }
/* ── Ambient background field (the signature: orbs glow in the active baby's color) ── */
.bg-field { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: radial-gradient(130% 100% at 50% -10%, var(--bg-1), var(--bg-0) 70%); pointer-events: none; }
.orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.55; transition: background 0.8s ease; will-change: transform; }
body.dark .orb { opacity: 0.42; filter: blur(70px); }
.orb-a { width: 320px; height: 320px; top: -90px; left: -70px; background: var(--accent); animation: float-a 22s ease-in-out infinite; }
.orb-b { width: 280px; height: 280px; top: 26%; right: -110px; background: var(--accent-2); animation: float-b 26s ease-in-out infinite; }
.orb-c { width: 360px; height: 360px; bottom: -130px; left: 30%; background: var(--accent); opacity: 0.32; animation: float-c 30s ease-in-out infinite; }
@keyframes float-a { 0%,100%{transform:translate(0,0)} 50%{transform:translate(40px,50px)} }
@keyframes float-b { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-50px,40px)} }
@keyframes float-c { 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,-40px)} }
/* ── Glass header ── */
.header { padding: max(16px,env(safe-area-inset-top)) 16px 14px; position: sticky; top: 0; z-index: 30; background: var(--glass); -webkit-backdrop-filter: blur(var(--blur-strong)) saturate(170%); backdrop-filter: blur(var(--blur-strong)) saturate(170%); border-bottom: 1px solid var(--glass-brd-2); }
.header-top { display: flex; align-items: center; justify-content: space-between; }
.app-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: center; gap: 7px; }
.app-sub { font-size: 11px; color: var(--sub); font-weight: 500; margin-top: 1px; }
.header-btns { display: flex; gap: 6px; align-items: center; }
.header-btns button { background: var(--glass-2); border: 1px solid var(--glass-brd-2); color: var(--txt); font-size: 15px; width: 34px; height: 34px; padding: 0; border-radius: 11px; cursor: pointer; font-weight: 600; font-family: inherit; display: inline-flex; align-items: center; justify-content: center; transition: transform 0.15s, background 0.2s; }
.header-btns button:active { transform: scale(0.9); }
/* ── Segmented control (baby switch) ── */
.pills { display: flex; gap: 4px; padding: 4px; background: var(--glass-2); border: 1px solid var(--glass-brd-2); border-radius: 15px; }
.pill { flex: 1; padding: 9px 0; border: none; border-radius: 11px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.3s cubic-bezier(.4,1.3,.5,1); white-space: nowrap; color: var(--sub); background: transparent; letter-spacing: -0.01em; }
.pill.on { color: #fff; background: var(--grad); box-shadow: 0 6px 16px -4px var(--accent); transform: translateY(-0.5px); }
/* Floating baby switch — sits in the thumb zone just above the tab bar */
.baby-switch { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tab-h) + 10px); width: min(480px,100%); padding: 0 14px; z-index: 92; }
.baby-switch .pills { background: var(--glass-strong); -webkit-backdrop-filter: blur(var(--blur-strong)) saturate(180%); backdrop-filter: blur(var(--blur-strong)) saturate(180%); box-shadow: 0 10px 30px -10px rgba(8,10,22,0.4); }
.baby-switch .pill { padding: 11px 0; font-size: 15px; }
body.has-baby-switch { padding-bottom: calc(var(--tab-h) + 80px); }
.tabs { display: flex; gap: 4px; }
.tab { flex: 1; padding: 8px 0; border: none; border-radius: 11px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.25s; white-space: nowrap; background: var(--glass-2); color: var(--sub); }
.tab.on { background: var(--glass-strong); color: var(--txt); }
/* ── Bottom tab bar ── */
.tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(480px,100%); z-index: 90; display: flex; padding: 9px 10px calc(9px + env(safe-area-inset-bottom)); gap: 4px; background: var(--glass); -webkit-backdrop-filter: blur(var(--blur-strong)) saturate(170%); backdrop-filter: blur(var(--blur-strong)) saturate(170%); border-top: 1px solid var(--glass-brd-2); }
.tabbar-btn { flex: 1; border: none; background: transparent; cursor: pointer; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px 0; color: var(--hint); border-radius: 13px; transition: color 0.2s, transform 0.15s; }
.tabbar-btn svg { width: 23px; height: 23px; stroke-width: 1.7; }
.tabbar-btn span { font-size: 10px; font-weight: 600; letter-spacing: -0.01em; }
.tabbar-btn.on { color: var(--accent); }
.tabbar-btn:active { transform: scale(0.9); }
.fab-wrap { position: fixed; bottom: calc(var(--tab-h) + 74px); right: max(16px,calc(50% - 232px)); z-index: 95; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; pointer-events: none; }
.fab-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 11px; pointer-events: none; }
.fab-action { display: inline-flex; align-items: center; gap: 10px; border: none; background: transparent; cursor: pointer; font-family: inherit; padding: 0; opacity: 0; transform: translateY(14px) scale(.92); pointer-events: none; transition: opacity .25s ease, transform .28s cubic-bezier(.32,1.25,.4,1); }
.fab-wrap.open .fab-action { opacity: 1; transform: none; pointer-events: auto; }
.fab-wrap.open .fab-action:nth-child(1){ transition-delay:.16s }
.fab-wrap.open .fab-action:nth-child(2){ transition-delay:.12s }
.fab-wrap.open .fab-action:nth-child(3){ transition-delay:.08s }
.fab-wrap.open .fab-action:nth-child(4){ transition-delay:.04s }
.fab-wrap.open .fab-action:nth-child(5){ transition-delay:0s }
.fab-action-label { background: var(--solid); border: 1px solid var(--glass-brd); padding: 8px 13px; border-radius: 13px; font-size: 13px; font-weight: 600; color: var(--txt); box-shadow: var(--shadow-sm); white-space: nowrap; }
.fab-action-ic { width: 46px; height: 46px; border-radius: 15px; background: var(--solid); border: 1px solid var(--glass-brd); display: inline-flex; align-items: center; justify-content: center; font-size: 21px; box-shadow: var(--shadow-sm); }
.fab-add { width: 56px; height: 56px; border-radius: 19px; background: var(--grad); color: #fff; border: none; cursor: pointer; box-shadow: 0 10px 28px -6px var(--accent); display: flex; align-items: center; justify-content: center; transition: transform .3s cubic-bezier(.4,1.3,.5,1); pointer-events: auto; }
.fab-add .plus { display: inline-block; font-size: 30px; line-height: 1; transition: transform .3s cubic-bezier(.4,1.3,.5,1); }
.fab-wrap.open .fab-add .plus { transform: rotate(45deg); }
.fab-add:active { transform: scale(.9); }
.fab-overlay { position: fixed; inset: 0; z-index: 94; background: transparent; }
/* ── Cards & surfaces ── */
.cal-wrap { padding: 12px 14px 0; }
.cal { background: var(--glass); -webkit-backdrop-filter: blur(var(--blur)) saturate(160%); backdrop-filter: blur(var(--blur)) saturate(160%); border: 1px solid var(--glass-brd); border-radius: var(--r-md); padding: 13px; box-shadow: var(--shadow-sm); }
/* Calendario ridotto a una barra: giorno corrente e due frecce */
.cal-bar { display: flex; align-items: center; gap: 6px; padding: 7px 8px; }
.cal-arrow { border: none; width: 32px; height: 32px; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; background: var(--accent-soft,var(--glass-2)); color: var(--accent); flex-shrink: 0; }
.cal-date { flex: 1; border: none; background: transparent; font-family: inherit; font-size: 14px; font-weight: 700; color: var(--txt); letter-spacing: -0.01em; cursor: pointer; padding: 8px 4px; }
.cal-caret { font-size: 9px; color: var(--hint); margin-left: 2px; }
.cal-today { border: none; background: var(--accent-soft,var(--glass-2)); color: var(--accent); font-family: inherit; font-size: 11px; font-weight: 700; padding: 6px 10px; border-radius: 9px; cursor: pointer; flex-shrink: 0; }
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-nav button { border: none; width: 30px; height: 30px; border-radius: 10px; font-size: 15px; cursor: pointer; font-weight: 700; font-family: inherit; background: var(--accent-soft,var(--glass-2)); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; }
.cal-nav span { font-weight: 700; font-size: 14px; letter-spacing: -0.01em; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; text-align: center; }
.cal-head { font-size: 10px; font-weight: 700; color: var(--hint); padding: 3px 0; text-transform: uppercase; letter-spacing: 0.03em; }
.cal-day { border: none; width: 100%; aspect-ratio: 1; border-radius: 12px; font-size: 13px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: transparent; font-family: inherit; font-weight: 600; color: var(--txt); transition: all 0.18s; }
.cal-day.other { color: var(--hint); opacity: 0.5; }
.cal-dots { display: flex; gap: 2px; }
.cal-dot { width: 4px; height: 4px; border-radius: 50%; }
.recap-section { padding: 14px 14px 0; }
.recap-label { font-size: 13px; font-weight: 700; color: var(--txt); margin-bottom: 9px; letter-spacing: -0.01em; }
.recap-row { display: flex; gap: 10px; }
.recap-card { flex: 1; min-width: 0; background: var(--glass); -webkit-backdrop-filter: blur(var(--blur)) saturate(160%); backdrop-filter: blur(var(--blur)) saturate(160%); border: 1px solid var(--glass-brd); border-radius: var(--r-md); padding: 13px 13px 12px; box-shadow: var(--shadow-sm); position: relative; }
.recap-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: var(--r-md) var(--r-md) 0 0; background: var(--cardgrad,var(--grad)); }
.recap-name { font-size: 14px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 4px; letter-spacing: -0.01em; }
.recap-line { display: flex; align-items: center; gap: 5px; font-size: 12px; margin-bottom: 4px; color: var(--sub); }
.recap-line b { font-weight: 700; color: var(--txt); }
.recap-line .sub { font-size: 10px; color: var(--hint); }
.recap-period { display: flex; flex-direction: column; gap: 1px; line-height: 1.2; }
.recap-period .sub { font-size: 14px; font-weight: 700; color: var(--txt); }
.recap-range { font-size: 9px; font-weight: 500; color: var(--hint); opacity: 0.7; letter-spacing: 0; }
.recap-line-last { margin-bottom: 8px; align-items: center; }
.recap-divider { height: 1px; background: var(--glass-brd); margin: 0 0 7px; border-radius: 1px; }
.therapy-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.therapy-badge { display: inline-flex; align-items: center; gap: 2px; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 8px; }
.therapy-badge.done { background: var(--green-light); color: var(--green); }
.therapy-badge.pending { background: var(--red-light); color: var(--red); }
.content { padding: 16px 14px 0; }
.content-title { font-size: 13px; font-weight: 700; color: var(--txt); margin-bottom: 9px; letter-spacing: -0.01em; }
.empty { background: var(--glass-2); border: 1px solid var(--glass-brd-2); border-radius: var(--r-md); padding: 22px 16px; text-align: center; color: var(--hint); font-size: 13px; font-weight: 500; }
.entry { background: var(--glass); -webkit-backdrop-filter: blur(var(--blur)) saturate(150%); backdrop-filter: blur(var(--blur)) saturate(150%); border: 1px solid var(--glass-brd); border-radius: var(--r-sm); padding: 11px 13px; box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 11px; margin-bottom: 8px; cursor: pointer; transition: transform 0.15s; position: relative; }
.entry::before { content: ''; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: var(--accent); }
.entry:active { transform: scale(0.99); }
.entry-icon { font-size: 19px; flex-shrink: 0; }
.entry-body { flex: 1; min-width: 0; }
.entry-top { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.entry-time { font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
.entry-ml { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.entry-tag { font-size: 9px; padding: 2px 7px; border-radius: 7px; font-weight: 700; }
.entry-note { font-size: 11px; color: var(--hint); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Il riassunto della pappa è il contenuto della riga: va a capo invece di troncarsi */
.entry-note.wrap { white-space: normal; overflow: visible; line-height: 1.45; }
/* Iniziale del bambino sulle righe della giornata condivisa */
.baby-chip { font-size: 10px; font-weight: 800; width: 18px; height: 18px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
/* Intestazione di fascia oraria dentro la giornata */
.tl-band { display: flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--hint); margin: 14px 0 8px; }
.tl-band:first-child { margin-top: 2px; }
.tl-band::after { content: ''; flex: 1; height: 1px; background: var(--hair); }
/* Riga condivisa dai due bambini: la pastiglia si allarga per ospitare il valore */
.baby-chip.wide { width: auto; height: 20px; padding: 0 8px; gap: 4px; font-size: 11px; }
.baby-chip.wide b { font-weight: 800; font-variant-numeric: tabular-nums; }
.group-caret { font-size: 10px; color: var(--hint); flex-shrink: 0; transition: transform 0.2s; }
.entry.group.open .group-caret { transform: rotate(180deg); }
.group-detail { margin: -2px 0 8px 16px; padding-left: 12px; border-left: 2px solid var(--hair); }
.group-detail .entry { margin-bottom: 6px; }
/* Scelta del bambino prima di un inserimento */
.baby-pick { display: flex; gap: 10px; margin-bottom: 14px; }
.baby-pick-btn { flex: 1; padding: 22px 10px; border: none; border-radius: var(--r-md); color: #fff; font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer; box-shadow: var(--shadow-sm); transition: transform 0.15s; letter-spacing: -0.01em; }
.baby-pick-btn:active { transform: scale(0.97); }
.baby-pick-btn.both { width: 100%; padding: 16px 10px; margin-bottom: 14px; font-size: 15px; }
/* Pappa data a tutti e due: una fila di giudizi per bambino */
.liking-for { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
.liking-who { font-size: 12px; font-weight: 800; letter-spacing: -0.01em; width: 58px; flex-shrink: 0; }
.liking-for .chips { flex: 1; }
.entry-del { border: none; background: var(--red-light); color: var(--red); width: 26px; height: 26px; border-radius: 9px; font-size: 12px; cursor: pointer; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: inherit; transition: transform 0.15s; }
.entry-del:active { transform: scale(0.85); }
.fruit-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.fruit-chip { position: relative; display: flex; align-items: center; gap: 6px; padding: 9px 14px 9px 11px; border: 1px solid var(--glass-brd-2); border-radius: var(--r-sm); background: var(--glass-2); color: var(--txt); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: transform 0.15s; }
.fruit-chip:active { transform: scale(0.94); }
.fruit-chip .fruit-emoji { font-size: 17px; }
.fruit-chip.add { border-style: dashed; color: var(--sub); }
.fruit-badge { position: absolute; top: -6px; right: -6px; background: var(--grad); color: #fff; font-size: 10px; font-weight: 800; min-width: 17px; height: 17px; border-radius: 9px; display: flex; align-items: center; justify-content: center; padding: 0 4px; box-shadow: 0 3px 8px -2px var(--accent); }
.fruit-log-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--glass); border: 1px solid var(--glass-brd); border-radius: var(--r-sm); padding: 8px 10px; margin-bottom: 7px; }
.fruit-log-name { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; }
.fruit-stepper { display: flex; align-items: center; gap: 10px; }
.fruit-step-btn { border: none; width: 30px; height: 30px; border-radius: 9px; background: var(--glass-2); color: var(--txt); font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; }
.fruit-step-btn:active { transform: scale(0.88); }
.fruit-stepper .entry-del { width: 30px; height: 30px; margin-left: 8px; }
.fruit-step-count { min-width: 18px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }
.fruit-chip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.meal-item-row { display: flex; align-items: center; gap: 8px; background: var(--glass); border: 1px solid var(--glass-brd); border-radius: var(--r-sm); padding: 8px 10px; margin-bottom: 6px; font-size: 13px; font-weight: 600; }
.meal-item-qty { margin-left: auto; color: var(--sub); font-weight: 800; font-variant-numeric: tabular-nums; }
.meal-total { display: flex; align-items: baseline; gap: 8px; margin: 14px 0 4px; font-size: 13px; font-weight: 700; }
.meal-total b { font-size: 19px; color: var(--accent); }
/* Riepilogo compatto: una riga bassa per bambino, sopra la giornata */
.recap-strip { padding: 0 14px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
.recap-line-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 13px; border: 1px solid var(--glass-brd); border-radius: var(--r-sm); background: var(--glass); -webkit-backdrop-filter: blur(var(--blur)) saturate(150%); backdrop-filter: blur(var(--blur)) saturate(150%); box-shadow: var(--shadow-sm); font-family: inherit; color: var(--txt); cursor: pointer; position: relative; overflow: hidden; transition: transform 0.15s, border-color 0.2s; }
.recap-line-btn::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--bcol); }
.recap-line-btn:active { transform: scale(0.99); }
.recap-line-btn.on { border-color: var(--bcol); }
.recap-who { font-size: 13px; font-weight: 700; color: var(--bcol); letter-spacing: -0.01em; flex-shrink: 0; }
.recap-nums { font-size: 12px; font-weight: 500; color: var(--sub); font-variant-numeric: tabular-nums; }

// Compact Italian date for the last weigh-in, e.g. "18 giu" (year appended only when not current).
function fmtNiceDate(ymd) {
  const [y,m,d] = ymd.split('-').map(Number);
  return d + ' ' + MONTHS[m-1].slice(0,3).toLowerCase() + (y !== new Date().getFullYear() ? ' ' + y : '');
}
// Gain between the latest weigh-in and an earlier reference one. Looks back up to
// maxDays from the LAST weigh-in and takes the oldest weigh-in inside that window
// (so the interval is the largest available, capped at maxDays); if none falls in
// the window, falls back to the immediately preceding weigh-in so the card is never
// empty. Returns {delta, days, from, to} where days is the real interval between
// the two weigh-ins and from/to are their dates. Returns null when <2 weigh-ins.
function weightDeltaDays(bn, maxDays) {
  const hist = getWeightHistory(bn);
  if (hist.length < 2) return null;
  const last = hist[hist.length-1];
  const [ly,lm,ld] = last.date.split('-').map(Number);
  const lastDate = new Date(ly, lm-1, ld);
  const cutKey = dk(new Date(ly, lm-1, ld-maxDays));
  let ref = null;
  for (const p of hist) { if (p.date >= cutKey && p.date < last.date) { ref = p; break; } }
  if (!ref) ref = hist[hist.length-2];
  const [ry,rm,rd] = ref.date.split('-').map(Number);
  const days = Math.round((lastDate - new Date(ry, rm-1, rd)) / 86400000);
  return { delta: +(last.kg - ref.kg).toFixed(2), days, from: ref.date, to: last.date };
}
// Delta between the last two consecutive weigh-ins (no window constraint).
function weightDeltaLast(bn) {
  const hist = getWeightHistory(bn);
  if (hist.length < 2) return null;
  const last = hist[hist.length-1], ref = hist[hist.length-2];
  const [ly,lm,ld]=last.date.split('-').map(Number), [ry,rm,rd]=ref.date.split('-').map(Number);
  const days = Math.round((new Date(ly,lm-1,ld)-new Date(ry,rm-1,rd))/86400000);
  return { delta: +(last.kg - ref.kg).toFixed(2), days, from: ref.date, to: last.date };
}
// "1 giorno" / "N giorni"
function dayLabel(n) { return n + (n===1 ? ' giorno' : ' giorni'); }
// Compact Italian date range, e.g. "11–15 giu" (month collapsed when shared; year only when not current).
function fmtRange(from, to) {
  const [fy,fm,fd] = from.split('-').map(Number);
  const [ty,tm,td] = to.split('-').map(Number);
  const yNow = new Date().getFullYear();
  const mon = m => MONTHS[m-1].slice(0,3).toLowerCase();
  if (fy===ty && fm===tm) return fd+'–'+td+' '+mon(tm)+(ty!==yNow?' '+ty:'');
  return fd+' '+mon(fm)+(fy!==yNow?' '+fy:'')+' – '+td+' '+mon(tm)+(ty!==yNow?' '+ty:'');
}

// Il giudizio si dà sulla pappa intera, quindi l'unità di misura di questa scheda è la
// combinazione di alimenti: tutte le volte che è stata fatta, con l'esito, per bambino.
function likeStats() {
  const out={};
  for (const key in state.data) {
    if(!/^\d{4}-\d{2}-\d{2}$/.test(key)) continue;
    BABIES.forEach(bn=>{
      (state.data[key]?.[bn]?.meals||[]).forEach(m=>{
        const ck=comboKey(m); if(!ck) return;
        const e=out[ck]||(out[ck]={ key:ck, total:0, last:'', byBaby:{} });
        const b=e.byBaby[bn]||(e.byBaby[bn]={ good:0, ok:0, bad:0, none:0, total:0, dates:[] });
        const lk=likingOf(m);
        b[lk||'none']++; b.total++; e.total++;
        if(key>e.last) e.last=key;
        b.dates.push({ date:key, time:m.time, liking:lk });
      });
    });
  }
  // Punteggio da -1 a +1 sulle sole pappe giudicate: decide in quale blocco finisce la riga.
  Object.values(out).forEach(e=>{
    let good=0, bad=0, judged=0;
    Object.values(e.byBaby).forEach(b=>{ good+=b.good; bad+=b.bad; judged+=b.good+b.ok+b.bad; });
    e.judged=judged;
    e.score=judged?(good-bad)/judged:null;
  });
  return out;
}

// Con bn='both' il modale porta un campo per bambino: li pesate uno dopo l'altro, e
// un campo lasciato vuoto significa semplicemente "questo non l'ho pesato".
function openWeightModal(bn) {
  const both = bn==='both';
  state.addFor = bn;
  if(!both) state.baby = bn;
  const babies = both ? BABIES : [bn];
  const c = both ? COLORS.both : COLORS[bn];
  const n=new Date(), h=n.getHours(), m=n.getMinutes();
  const mins=[0,15,30,45], nearM=mins.reduce((a,b)=>Math.abs(b-m)<Math.abs(a-m)?b:a);
  const hO=Array.from({length:24},(_,i)=>`<option value="${i}"${i===h?' selected':''}>${String(i).padStart(2,'0')}</option>`).join("");
  const mO=mins.map(i=>`<option value="${i}"${i===nearM?' selected':''}>${String(i).padStart(2,'0')}</option>`).join("");
  const key=dk(state.selDate);
  const anyExisting = babies.some(b=>state.data[key]?.[b]?.weight);
  const wNote = (babies.map(b=>state.data[key]?.[b]?.weight?.note).find(Boolean))||'';
  const fields = babies.map(b=>{
    const ex=state.data[key]?.[b]?.weight;
    return `<div class="form-label"${both?` style="color:${COLORS[b].pri}"`:''}>Peso${both?' — '+b:''} (kg)</div><input class="form-input big" type="text" inputmode="decimal" id="w-kg-${b}" value="${ex?itNum(ex.kg):''}" placeholder="es. 3,45" style="margin-bottom:12px">`;
  }).join('');
  setModal(`<div class="modal-bg" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><div class="modal-handle"></div><div class="modal-title" style="color:${c.acc}">${anyExisting?'Modifica':'Aggiungi'} peso — ${both?BABIES.join(' e '):bn}</div><div class="form-label">Ora</div><div class="form-row"><select class="form-select" id="f-h">${hO}</select><span style="font-size:18px;font-weight:800;color:#999">:</span><select class="form-select" id="f-m">${mO}</select></div>${fields}<div class="form-label">Note (opzionale)</div><input class="form-input" id="w-note" value="${wNote}" placeholder="es. prima della poppata..." style="margin-bottom:12px"><div class="form-actions"><button class="btn-cancel" onclick="closeModal()">Annulla</button><button class="btn-save" style="background:${c.grad}" onclick="submitWeight('${bn}')">${anyExisting?'Salva':'Aggiungi'} ⚖️</button></div></div></div>`);
}
async function submitWeight(bn) {
  const babies = bn==='both' ? BABIES : [bn];
  const h=parseInt(document.getElementById("f-h").value), m=parseInt(document.getElementById("f-m").value);
  const key=dk(state.selDate), note=document.getElementById("w-note").value.trim();
  let scritti=0;
  babies.forEach(b=>{
    const el=document.getElementById("w-kg-"+b);
    if(!el) return;
    const kg=parseFloat(el.value.replace(",","."));
    if(!kg||isNaN(kg)) return; // campo vuoto: quel bambino non si pesa
    if(!state.data[key]) state.data[key]={};
    if(!state.data[key][b]) state.data[key][b]={};
    state.data[key][b].weight={kg, time:ft(h,m), note, addedAt: Date.now()};
    scritti++;
  });
  if(!scritti) return;
  await saveData(); closeModal(); render();
}
async function delWeight(bn) {
  const key=dk(state.selDate);
  if(state.data[key]?.[bn]?.weight) {
    addTombstone({ kind: 'weight', dateKey: key, baby: bn });
    delete state.data[key][bn].weight;
    if(!Object.keys(state.data[key][bn]).length) delete state.data[key][bn];
    if(state.data[key]&&!Object.keys(state.data[key]).length) delete state.data[key];
    await saveData(); render();
  }
}
function getWeightHistory(bn) {
  const points=[];

    const w=state.data[date]?.[bn]?.weight;

}
let weightChartState = { range: '30', offset: 0, mobileFrom: null, mobileTo: null };
function navWeightChart(delta) {

// Build the universe of dates that have at least one weight measurement.
// Used by the Mobile filter to populate the cascading "Mese/Anno" + "Giorno" dropdowns.
function getWeightDateUniverse() {
  const dates = new Set();
  getWeightHistory("Gabriel").forEach(p => dates.add(p.date));
  getWeightHistory("Vittorio").forEach(p => dates.add(p.date));
  const sorted = [...dates].sort();
  const byMonth = {};
  for (const d of sorted) {
    const ym = d.slice(0, 7);
    if (!byMonth[ym]) byMonth[ym] = [];
    byMonth[ym].push(d);
  }
  return { sorted, byMonth, months: Object.keys(byMonth).sort() };
}
function fmtMonthYear(ym) {
  const [y, m] = ym.split('-');
  const mn = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
  return `${mn[parseInt(m,10)-1]} ${y}`;
}
function setMobileMacro(side, ym) {

  if (side === 'from') weightChartState.mobileFrom = days[0];
  else weightChartState.mobileTo = days[days.length - 1];
  // Swap if inverted
  if (weightChartState.mobileFrom && weightChartState.mobileTo &&
      weightChartState.mobileFrom > weightChartState.mobileTo) {
    [weightChartState.mobileFrom, weightChartState.mobileTo] =
      [weightChartState.mobileTo, weightChartState.mobileFrom];
  }
  render();
}
function setMobileDay(side, ymd) {
  if (side === 'from') weightChartState.mobileFrom = ymd;
  else weightChartState.mobileTo = ymd;
  if (weightChartState.mobileFrom && weightChartState.mobileTo &&
      weightChartState.mobileFrom > weightChartState.mobileTo) {
    [weightChartState.mobileFrom, weightChartState.mobileTo] =
      [weightChartState.mobileTo, weightChartState.mobileFrom];
  }
  render();
}
function buildMobilePicker() {
  const u = getWeightDateUniverse();
  if (!u.sorted.length) {
    return '<div style="font-size:11px;color:#999;text-align:center;padding:8px 0">Nessuna pesata registrata.</div>';
  }

  const fromYm = from ? from.slice(0, 7) : u.months[0];
  const toYm = to ? to.slice(0, 7) : u.months[u.months.length - 1];

  return `<div style="display:flex;gap:6px;align-items:center;margin:6px 0;font-size:11px;font-weight:700;color:#555">
    <span style="min-width:24px">Da:</span>

}
function pickWeightPoint(baby, date, kg, px, py) {

// Build full inner content (toolbar + chart-or-empty + legend + delta + footer).
function buildWeightChartContent(inline) {
  const r = weightChartState.range, off = weightChartState.offset;
  const gDataAll = getWeightHistory("Gabriel"), vDataAll = getWeightHistory("Vittorio");
  // Compute window [startKey, endKey]
  const now = new Date();

    startKey = weightChartState.mobileFrom;

    if (startKey && endKey) {
      const [sy,sm,sd]=startKey.split('-'), [ey,em,ed]=endKey.split('-');
      navLabel = `${parseInt(sd,10)}/${parseInt(sm,10)} — ${parseInt(ed,10)}/${parseInt(em,10)}`;
    }
  } else if (r === '30') {
    const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() - off*30);
    const start = new Date(end.getFullYear(), end.getMonth(), end.getDate() - 29);
    startKey = dk(start); endKey = dk(end);
    navLabel = `${start.getDate()}/${start.getMonth()+1} — ${end.getDate()}/${end.getMonth()+1}`;
  } else if (r === '60') {
    const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() - off*60);
    const start = new Date(end.getFullYear(), end.getMonth(), end.getDate() - 59);
    startKey = dk(start); endKey = dk(end);
    navLabel = `${start.getDate()}/${start.getMonth()+1} — ${end.getDate()}/${end.getMonth()+1}`;
  } else if (r === '90') {
    const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() - off*90);
    const start = new Date(end.getFullYear(), end.getMonth(), end.getDate() - 89);
    startKey = dk(start); endKey = dk(end);
    navLabel = `${start.getDate()}/${start.getMonth()+1} — ${end.getDate()}/${end.getMonth()+1}`;
  }
  const inRange = (p) => (!startKey || p.date >= startKey) && (!endKey || p.date <= endKey);
  const gData = r === 'max' ? gDataAll : gDataAll.filter(inRange);
  const vData = r === 'max' ? vDataAll : vDataAll.filter(inRange);
  // Nav row: rolling-window filters (30/60/90); Mobile and Max have no arrows.
  const navHtml = (r === '30' || r === '60' || r === '90') ? `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px"><button onclick="event.stopPropagation();navWeightChart(1)" style="border:none;width:32px;height:32px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:16px;font-weight:700;cursor:pointer;font-family:inherit">‹</button><span style="font-size:13px;font-weight:700;color:var(--txt)">${navLabel}</span><button onclick="event.stopPropagation();navWeightChart(-1)" style="border:none;width:32px;height:32px;border-radius:10px;background:${off===0?'var(--glass-2)':'var(--accent-soft)'};color:${off===0?'var(--hint)':'var(--accent)'};font-size:16px;font-weight:700;cursor:pointer;font-family:inherit"${off===0?' disabled':''}>›</button></div>` : '';
  // Range toolbar — Mobile replaces 7g; 60g added between 30g and 90g.
  const ranges = [{k:'mobile',l:'Mobile'},{k:'30',l:'30g'},{k:'60',l:'60g'},{k:'90',l:'90g'},{k:'max',l:'Max'}];
  const mobilePicker = r === 'mobile' ? buildMobilePicker() : '';
  const toolbar = `${navHtml}<div class="weight-range-row">${ranges.map(rr => `<button class="weight-range-btn${r===rr.k?' active':''}" onclick="event.stopPropagation();setWeightRange('${rr.k}')">${rr.l}</button>`).join('')}</div>${mobilePicker}`;
  const legend = `<div class="weight-legend"><div class="weight-legend-item"><div class="weight-legend-dot" style="background:${COLORS.Gabriel.pri}"></div>Gabriel</div><div class="weight-legend-item"><div class="weight-legend-dot" style="background:${COLORS.Vittorio.pri}"></div>Vittorio</div></div>`;
  // Delta (only for 7/30/90)
  let deltaHtml = '';
  if (r !== 'max') {
    function deltaLine(data, color, name) {
      if (data.length < 2) return '';

      const diff = +(last.kg - first.kg).toFixed(2);
      const sign = diff > 0 ? '+' : '';
      const fmt = (n) => String(n).replace('.', ',');
      return `<div style="font-size:11px;color:#555"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${color};margin-right:5px"></span><b>${name}</b>: ${fmt(first.kg)} → ${fmt(last.kg)} kg <b style="color:${diff>=0?'#10B981':'#EF4444'}">(${sign}${fmt(diff)})</b></div>`;
    }
    const gLine = deltaLine(gData, COLORS.Gabriel.pri, 'Gabriel');
    const vLine = deltaLine(vData, COLORS.Vittorio.pri, 'Vittorio');
    if (gLine || vLine) {
      const deltaLabel = r==='mobile' ? 'intervallo selezionato'
        : r==='30' ? '30 giorni'
        : r==='60' ? '60 giorni'
        : '90 giorni';
      deltaHtml = `<div style="margin-top:10px;padding:8px 10px;background:#f5f5fa;border-radius:10px"><div style="font-size:10px;color:#888;font-weight:700;margin-bottom:4px">Δ PESO (${deltaLabel})</div>${gLine}${vLine}</div>`;
    }
  }
  const footer = inline ? '' : `<div style="margin-top:10px"><button class="btn-cancel" style="width:100%" onclick="closeModal()">Chiudi</button></div>`;
  // Empty state
  if (!gData.length && !vData.length) {
    return `${toolbar}<div style="padding:40px 10px;text-align:center;color:#999;font-size:12px">Nessuna pesata nell'intervallo selezionato.</div>${legend}${footer}`;
  }
  // Collect all dates in filtered range
  const allDates=[...new Set([...gData.map(p=>p.date),...vData.map(p=>p.date)])].sort();
  const allKg=[...gData.map(p=>p.kg),...vData.map(p=>p.kg)];
  const minKg=Math.floor(Math.min(...allKg)*10)/10-0.2, maxKg=Math.ceil(Math.max(...allKg)*10)/10+0.2;
  const H=260, pad={t:25,r:15,b:40,l:40};
  const W = r==='max' ? Math.max(420, 25*allDates.length+pad.l+pad.r) : 420;
  const cw=W-pad.l-pad.r, ch=H-pad.t-pad.b;
  const xOf = (i) => pad.l+(i/(allDates.length-1||1))*cw;
  const yOf = (kg) => pad.t+ch-(((kg-minKg)/(maxKg-minKg||1))*ch);
  const svgStyle = r==='max' ? `style="min-width:${W}px"` : '';
  let svg=`<svg viewBox="0 0 ${W} ${H}" class="weight-chart-canvas" ${svgStyle} xmlns="http://www.w3.org/2000/svg">`;
  svg+=`<rect x="0" y="0" width="${W}" height="${H}" fill="transparent" onclick="event.stopPropagation();closeWeightTooltip()"/>`;
  const steps=5;
  for(let i=0;i<=steps;i++){
    const val=minKg+((maxKg-minKg)/steps)*i, yy=yOf(val);
    svg+=`<line x1="${pad.l}" y1="${yy}" x2="${W-pad.r}" y2="${yy}" stroke="#eee" stroke-width="1"/>`;
    svg+=`<text x="${pad.l-5}" y="${yy+3}" text-anchor="end" font-size="8" fill="#aaa" font-family="Nunito">${val.toFixed(1)}</text>`;
  }
  const maxLabels = r==='max' ? allDates.length : Math.min(allDates.length,7);

    if(i%labelStep===0||i===allDates.length-1){
      const parts=d.split('-');
      svg+=`<text x="${xOf(i)}" y="${H-pad.b+18}" text-anchor="middle" font-size="8" fill="#aaa" font-family="Nunito">${parts[2]}/${parts[1]}</text>`;

  });

  const vPosByDate = {}; vData.forEach(p => { vPosByDate[p.date] = p.kg; });

    if(data.length<1) return '';

      const i=allDates.indexOf(p.date), px=xOf(i), py=yOf(p.kg);
      if(!path) path=`M${px},${py}`; else path+=` L${px},${py}`;
      circles+=`<circle cx="${px}" cy="${py}" r="6" fill="${color}" stroke="#fff" stroke-width="2" style="cursor:pointer" onclick="event.stopPropagation();pickWeightPoint('${bn}','${p.date}',${p.kg},${px},${py})"/>`;
      const otherKg = bn === 'Gabriel' ? vPosByDate[p.date] : gPosByDate[p.date];
      let labelY;

      }
      circles+=`<text x="${px}" y="${labelY}" text-anchor="middle" font-size="8" fill="${color}" font-weight="700" font-family="Nunito" style="pointer-events:none">${p.kg}</text>`;
    });
    return `<path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${circles}`;
  }
  svg+=drawLine(gData, COLORS.Gabriel.pri, 'Gabriel');
  svg+=drawLine(vData, COLORS.Vittorio.pri, 'Vittorio');
  svg+=`<g id="weight-tooltip" style="pointer-events:none"></g>`;

  const chartHtml = r==='max' ? `<div class="weight-chart-scroll">${svg}</div>` : svg;

}
// Range/Mobile changes update the inline Andamenti chart by re-rendering the page.
function setWeightRange(range) {
  if (range !== undefined) {
    if (weightChartState.range !== range) weightChartState.offset = 0;
    weightChartState.range = range;
  }
  // Initialize Mobile range defaults (first time the user picks Mobile)
  if (weightChartState.range === 'mobile' &&
      (!weightChartState.mobileFrom || !weightChartState.mobileTo)) {
    const u = getWeightDateUniverse();
    if (u.sorted.length) {
      weightChartState.mobileFrom = u.sorted[0];
      weightChartState.mobileTo = u.sorted[u.sorted.length - 1];
    }
  }
  render();
}

          <div style="font-size:11px;color:#666;margin-top:6px">Alimenti: ${Object.keys(foodsInPeriod).sort((a,b)=>foodsInPeriod[b]-foodsInPeriod[a]).map(id=>{const m=foodMeta(id);return `${m.emoji||''} ${m.name} ×${foodsInPeriod[id]}`;}).join(' · ')}</div>

  for(let i=0;i<7;i++){
    const d=new Date(startDate.getFullYear(),startDate.getMonth(),startDate.getDate()+i);
    const key=dk(d), bd=state.data[key]?.[bn];
    const feeds=bd?.feeds||[], diapers=bd?.diapers||[], meals=bd?.meals||[], temps=bd?.temperatures||[];
    days.push({
      key, date:d, dow:DAYNAMES[(d.getDay()+6)%7],
      isFuture:key>todayKey, isToday:key===todayKey,
      feeds, diapers, meals, temps, weight:bd?.weight||null,
      grams:meals.reduce((s,m)=>s+mealGrams(m),0),
      hasData:!!(feeds.length||diapers.length||meals.length||temps.length||bd?.weight)
    });
  }
  // Le medie girano sui giorni con dati non futuri: oggi conta, altrimenti il
  // riepilogo della settimana in corso resterebbe a zero fino a domani.
  const active=days.filter(d=>!d.isFuture&&d.hasData).length||1;
  const foodTotals={}, catGrams={}, catSpoons={}, likings={good:0,ok:0,bad:0};
  days.forEach(d=>d.meals.forEach(m=>{
    const lkKey=likingOf(m);
    if(lkKey&&likings[lkKey]!==undefined) likings[lkKey]++;
    (m.items||[]).forEach(it=>{
      (it.foods||[]).forEach(f=>{ foodTotals[f]=(foodTotals[f]||0)+1; });
      if(it.unit==='g') catGrams[it.cat]=(catGrams[it.cat]||0)+(+it.qty||0);
      else { // cucchiaini e cucchiai non si sommano fra loro: totale per unità
        catSpoons[it.cat]=catSpoons[it.cat]||{};
        catSpoons[it.cat][it.unit]=(catSpoons[it.cat][it.unit]||0)+(+it.qty||0);
      }
    });
  }));
  const firstTaste=firstTasteMap(bn), startKey=dk(startDate), endKey=dk(endDate);
  const newTastes=Object.keys(foodTotals)
    .filter(id=>firstTaste[id]>=startKey&&firstTaste[id]<=endKey)
    .sort((a,b)=>firstTaste[a].localeCompare(firstTaste[b]))
    .map(id=>({ id, date:firstTaste[id], meta:foodMeta(id) }));
  const withWeight=days.filter(d=>d.weight), withTemp=days.filter(d=>d.temps.length);
  const lastW=withWeight.length?withWeight[withWeight.length-1]:null;
  const lastT=withTemp.length?withTemp[withTemp.length-1]:null;
  return {
    bn, days, active, foodTotals, catGrams, catSpoons, likings, newTastes,
    label:fmtRange(startKey,endKey), isCurrentWeek:weeklyOffset===0,
    lastWeight:lastW?{ kg:lastW.weight.kg, dow:lastW.dow, day:lastW.date.getDate() }:null,
    lastTemp:lastT?{ temp:Math.max(...lastT.temps.map(t=>t.temp)), dow:lastT.dow, day:lastT.date.getDate() }:null
  };
}
// Le quattro metriche delle tile: come estrarre il valore di un giorno e come
// formattare media e totale.
// Separatore delle migliaia esplicito: toLocaleString('it-IT') non è affidabile su
// tutti i motori (alcuni build senza dati di locale restituiscono "5860").
function fmtNum(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
const WEEK_METRICS = {
  feeds:   { label:'Latte',     series:d=>d.feeds.length,   unit:'',   fmt:v=>v.toFixed(1).replace('.',','), tot:t=>`${t} in tutto` },
  meals:   { label:'Pappe',     series:d=>d.meals.length,   unit:'',   fmt:v=>v.toFixed(1).replace('.',','), tot:t=>`${t} in tutto` },
  diapers: { label:'Pannolini', series:d=>d.diapers.length, unit:'',   fmt:v=>v.toFixed(1).replace('.',','), tot:t=>`${t} in tutto` }
};
function metricValues(st, k) { return st.days.map(WEEK_METRICS[k].series); }
function microBars(vals, days) {
  const max=Math.max(...vals,1);
  return `<div class="wk-bars">${vals.map((v,i)=>
      `<div class="wk-bar${v?'':' empty'}" style="height:${v?Math.max(8,Math.round(v/max*100)):6}%"></div>`).join('')}</div>`
    + `<div class="wk-bar-days">${days.map(d=>`<span class="wk-bar-day${d.isToday?' today':''}">${d.dow[0]}</span>`).join('')}</div>`;
}
function buildWeeklyInline() {
  const bn = state.trendsBaby || 'Gabriel';
  const c = COLORS[bn], st = weeklyStats(bn);
  let h = `<div class="content"><div class="content-title">📅 Riepilogo settimanale</div>`;
  h += `<div class="pills" style="margin-bottom:12px">${BABIES.map(b=>`<button class="pill ${bn===b?'on':'off'}"${bn===b?` style="background:${COLORS[b].grad}"`:''} onclick="setTrendsWeeklyBaby('${b}')">${b}</button>`).join("")}</div>`;
  h += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:13px"><button onclick="navWeeklyTrends(1)" style="border:none;width:30px;height:30px;border-radius:10px;background:${hexA(c.pri,0.15)};color:${c.pri};font-size:15px;font-weight:700;cursor:pointer;font-family:inherit">‹</button><span style="font-size:14px;font-weight:700">${st.label}</span><button onclick="navWeeklyTrends(-1)"${st.isCurrentWeek?' disabled':''} style="border:none;width:30px;height:30px;border-radius:10px;background:${st.isCurrentWeek?'var(--glass-2)':hexA(c.pri,0.15)};color:${st.isCurrentWeek?'var(--hint)':c.pri};font-size:15px;font-weight:700;cursor:pointer;font-family:inherit">›</button></div>`;
  h += `<div class="wk-grid">${Object.keys(WEEK_METRICS).map(k=>{
    const m=WEEK_METRICS[k], vals=metricValues(st,k), tot=vals.reduce((a,b)=>a+b,0);
    return `<button class="wk-tile" onclick="openMetricDetail('${k}')">
      <div class="wk-tile-label">${m.label}</div>
      <div class="wk-tile-value">${m.fmt(tot/st.active)}${m.unit?`<span class="wk-tile-unit"> ${m.unit}</span>`:''}</div>
      <div class="wk-tile-sub">al giorno</div>
      ${microBars(vals, st.days)}
      <div class="wk-tile-foot">${m.tot(tot)}</div>
    </button>`;
  }).join('')}</div>`;
  h += `<div style="margin-top:15px">`;
  h += `<div class="wk-row"><span class="wk-row-label">Peso</span><span>${st.lastWeight?`<b>${String(st.lastWeight.kg).replace('.',',')} kg</b> <span style="color:var(--hint);font-size:11px">${st.lastWeight.dow.toLowerCase()} ${st.lastWeight.day}</span>`:'<span style="color:var(--hint);font-size:12px">nessuna pesata</span>'}</span></div>`;
  h += `<div class="wk-row"><span class="wk-row-label">Temperatura</span><span>${st.lastTemp?`<b style="color:${tempColor(st.lastTemp.temp)}">${String(st.lastTemp.temp).replace('.',',')} °C</b> <span style="color:var(--hint);font-size:11px">${st.lastTemp.dow.toLowerCase()} ${st.lastTemp.day}</span>`:'<span style="color:var(--hint);font-size:12px">nessuna misurazione</span>'}</span></div>`;
  h += `</div>`;
  const foods=Object.keys(st.foodTotals).sort((a,b)=>st.foodTotals[b]-st.foodTotals[a]);
  if (foods.length) {
    h += `<div class="wk-sec-label">Alimenti della settimana</div><div>${foods.map(id=>{
      const m=foodMeta(id);
      return `<span class="wk-pill">${m.emoji||'🍽️'} ${m.name} <b style="color:var(--accent)">${st.foodTotals[id]}</b></span>`;
    }).join('')}</div>`;
  }
  if (st.newTastes.length) {
    h += `<div class="wk-new"><div class="wk-tile-label" style="color:var(--accent);margin-bottom:5px">🆕 Nuovi assaggi</div>${st.newTastes.map(t=>{
      const p=t.date.split('-'), d=dkToDate(t.date);
      return `<div class="wk-row"><span>${t.meta.emoji||'🍽️'} ${t.meta.name}</span><span style="color:var(--sub);font-size:12px;font-weight:700">${DAYNAMES[(d.getDay()+6)%7].toLowerCase()} ${+p[2]}/${+p[1]}</span></div>`;
    }).join('')}</div>`;
  }
  // Il dettaglio resta disponibile ma richiuso: si apre in place, senza ridisegnare.
  h += `<button class="wk-disc" onclick="toggleWkDetail(this)"><span class="wk-disc-caret">▸</span> Dettaglio giorno per giorno</button>`;
  const rows=st.days.filter(d=>!d.isFuture).map(d=>{
    const bits=[];
    if(d.feeds.length) bits.push(`${d.feeds.length} latte`);
    if(d.meals.length) bits.push(`${d.meals.length} ${d.meals.length===1?'pappa':'pappe'}`);
    if(d.diapers.length) bits.push(`${d.diapers.length} ${d.diapers.length===1?'pannolino':'pannolini'}`);
    return `<div class="wk-row"><span style="font-weight:700">${d.dow} ${d.date.getDate()}</span><span style="color:${bits.length?'var(--sub)':'var(--hint)'};font-size:12px;text-align:right">${bits.join(' · ')||'—'}</span></div>`;
  }).join('');
  h += `<div id="wk-detail" hidden>${rows||'<div class="empty">Nessun dato questa settimana</div>'}</div>`;
  h += `</div>`;
  return h;
}
function toggleWkDetail(btn) {
  const el=document.getElementById('wk-detail');
  if(!el) return;
  el.hidden=!el.hidden;
  btn.querySelector('.wk-disc-caret').textContent = el.hidden ? '▸' : '▾';
}
// ── DETTAGLIO DI UNA METRICA ──
function openMetricDetail(k) {
  const st=weeklyStats(state.trendsBaby||'Gabriel'), c=COLORS[st.bn], m=WEEK_METRICS[k];
  const vals=metricValues(st,k), tot=vals.reduce((a,b)=>a+b,0), max=Math.max(...vals,1);
  const done=st.days.filter(d=>!d.isFuture);
  // Massimo e minimo solo fra i giorni in cui c'è stata una registrazione: un giorno
  // senza dati non è uno zero, è un dato che manca.
  const rec=done.filter(d=>m.series(d)>0), recVals=rec.map(m.series);
  const hi=recVals.length?Math.max(...recVals):0, lo=recVals.length?Math.min(...recVals):0;
  const hiDay=rec[recVals.indexOf(hi)], loDay=rec[recVals.indexOf(lo)];
  const u=m.unit?' '+m.unit:'';
  // Settimana senza registrazioni per questa metrica: grafico e statistiche a zero
  // non dicono nulla, meglio dirlo esplicitamente.
  if(!tot) {
    setModal(`<div class="modal-bg" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><div class="modal-handle"></div>
      <button class="meal-back" onclick="closeModal()">‹ Settimana</button>
      <div class="wk-tile-label">${m.label}</div>
      <div style="font-size:11px;color:var(--hint);font-weight:600;margin-bottom:14px">${st.label}</div>
      <div class="empty">Nessun dato registrato questa settimana</div>
      <div class="form-actions" style="margin-top:16px"><button class="btn-cancel" style="width:100%" onclick="closeModal()">Chiudi</button></div>
    </div></div>`);
    return;
  }
  const chart=`<div class="wk-chart">${st.days.map((d,i)=>
    `<div class="wk-chart-col"><span class="wk-chart-val">${vals[i]||''}</span><div class="wk-chart-bar" style="height:${vals[i]?Math.max(4,Math.round(vals[i]/max*100)):1}%;background:${vals[i]?c.grad:'var(--glass-brd-2)'}"></div><span class="wk-chart-day${d.isToday?' today':''}">${d.dow[0]}</span></div>`).join('')}</div>`;
  let extra='';
  if(k==='meals') {
    const grams=st.days.reduce((s,d)=>s+d.grams,0);
    const catRows=MEAL_CATS.filter(cat=>st.catGrams[cat.id]||st.catSpoons[cat.id]).map(cat=>
      `<div class="wk-row"><span>${cat.emoji} ${cat.name}</span><b>${st.catGrams[cat.id]
        ? `${st.catGrams[cat.id]} g`
        : Object.keys(st.catSpoons[cat.id]).map(u=>fmtQty({qty:st.catSpoons[cat.id][u],unit:u})).join(' · ')}</b></div>`).join('');
    const lk=Object.keys(LIKINGS).filter(x=>st.likings[x]).map(x=>`${LIKINGS[x].e} ${st.likings[x]}`).join(' · ');
    extra=`<div class="wk-row"><span class="wk-row-label">Quantità</span><b>${grams} g</b></div>`
      + (lk?`<div class="wk-row"><span class="wk-row-label">Gradimento</span><b>${lk}</b></div>`:'')
      + (catRows?`<div class="wk-sec-label">Per categoria</div>${catRows}`:'');
  }
  const dayRows=done.map(d=>{
    const v=m.series(d);
    let inner='';
    if(k==='meals'&&d.meals.length) {
      inner=d.meals.map(mm=>{
        const emo=(mm.items||[]).map(i=>(i.foods||[]).map(f=>foodMeta(f).emoji||'').join('')).join('');
        const g=mealGrams(mm), lk=LIKINGS[likingOf(mm)];
        return `<button class="wk-meal" onclick="toggleWkMeal('${mm.id}')"><span class="wk-meal-time">${mm.time}</span><span class="wk-meal-emo">${emo}</span><span class="wk-meal-g">${g?g+' g':''}${mealIsSnack(mm)?' 🍎':''}</span></button>`
          + `<div class="wk-meal-det" id="wkm-${mm.id}" hidden>${mealSummary(mm)}${lk?` · ${lk.e} ${lk.l}`:''}${mm.note?` · ${mm.note}`:''}</div>`;
      }).join('');
    } else if(k==='feeds'&&d.feeds.length) {
      // I ml compaiono solo dove erano stati registrati, cioè nelle poppate di prima.
      inner=`<div class="wk-day-sub">${d.feeds.map(x=>x.ml?`${x.time} · ${x.ml} ml`:x.time).join(' · ')}</div>`;
    } else if(k==='diapers'&&d.diapers.length) {
      const cnt={};
      d.diapers.forEach(x=>{ cnt[x.dtype]=(cnt[x.dtype]||0)+1; });
      inner=`<div class="wk-day-sub">${Object.keys(cnt).map(t=>`${t} ${cnt[t]}`).join(' · ')}</div>`;
    }
    const label=(k==='meals'&&d.grams)?`${v} · ${d.grams} g`:`${v}${u}`;
    return `<div class="wk-day"><div class="wk-day-head"><span>${d.dow} ${d.date.getDate()}</span><span${v?'':' class="wk-dim"'}>${v?label:'—'}</span></div>${inner}</div>`;
  }).join('');
  setModal(`<div class="modal-bg" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><div class="modal-handle"></div>
    <button class="meal-back" onclick="closeModal()">‹ Settimana</button>
    <div class="wk-tile-label">${m.label}</div>
    <div style="font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1">${m.fmt(tot/st.active)}${m.unit?`<span style="font-size:15px;font-weight:600;color:var(--sub)"> ${m.unit}</span>`:''}</div>
    <div style="font-size:11px;color:var(--hint);font-weight:600">al giorno · ${st.label}</div>
    ${chart}
    <div style="margin-top:12px">
      <div class="wk-row"><span class="wk-row-label">Totale</span><b>${fmtNum(tot)}${u}</b></div>
      <div class="wk-row"><span class="wk-row-label">Giorno più alto</span><span><b>${hi}${u}</b> <span style="color:var(--hint);font-size:11px">${hiDay?hiDay.dow.toLowerCase()+' '+hiDay.date.getDate():''}</span></span></div>
      <div class="wk-row"><span class="wk-row-label">Giorno più basso</span><span><b>${lo}${u}</b> <span style="color:var(--hint);font-size:11px">${loDay?loDay.dow.toLowerCase()+' '+loDay.date.getDate():''}</span></span></div>
      ${extra}
    </div>
    <div class="wk-sec-label">Giorno per giorno</div>
    ${dayRows||'<div class="empty">Nessun dato questa settimana</div>'}
    <div class="form-actions" style="margin-top:16px"><button class="btn-cancel" style="width:100%" onclick="closeModal()">Chiudi</button></div>
  </div></div>`);
}
function toggleWkMeal(id) {
  const el=document.getElementById('wkm-'+id);
  if(el) el.hidden=!el.hidden;
}
// ─── AUTH ───
const APP_PASSWORD = "Ebby";
const AUTH_KEY = "pappatracker_auth";
function isAuthenticated() {
  return sessionStorage.getItem(AUTH_KEY) === "true";
}
function showLockScreen() {
  document.getElementById("app").innerHTML = `<div class="lock-screen">
    <div class="lock-icon">🥣</div>
    <div class="lock-title">Pappa V2</div>
    <div class="lock-sub">Gabriel & Vittorio</div>
    <input class="lock-input" type="password" id="lock-pwd" placeholder="Password" onkeydown="if(event.key==='Enter')checkPassword()">
    <button class="lock-btn" onclick="checkPassword()">Accedi</button>
    <div class="lock-error" id="lock-err"></div>
  </div>`;
  document.getElementById("lock-pwd").focus();
}
function checkPassword() {
  const pwd = document.getElementById("lock-pwd").value;
  if (pwd === APP_PASSWORD) {
    sessionStorage.setItem(AUTH_KEY, "true");
    initApp();
  } else {
    document.getElementById("lock-err").textContent = "Password errata";
    document.getElementById("lock-pwd").value = "";
    document.getElementById("lock-pwd").focus();
  }
}
let supaClient = null;
let realtimeChannel = null;
function initRealtime() {
  if (!useSupabase() || !window.supabase || supaClient) return;
  try {
    supaClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    realtimeChannel = supaClient
      .channel('pappa-changes')
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'pappa_tracker_data', filter: 'id=eq.main' },
        (payload) => {
          const row = payload && (payload.new || payload.record);
          if (row && row.data) {
            state.data = mergeData(state.data, row.data);
            migrateTemperatures();
            cleanDuplicates();
            saveLocal();
            render();
          }
        })
      .subscribe();
  } catch(e) { console.error("Realtime init error:", e); }
}
let lastFocusSync = 0;
function onAppFocus() {
  if (!isAuthenticated()) return;
  // Throttle: avoid double fire (visibilitychange + focus often fire together)
  const now = Date.now();
  if (now - lastFocusSync < 1500) return;
  lastFocusSync = now;
  syncFromCloud();
}
function initApp() {
  loadLocal();
  render();
  syncFromCloud().then(() => initRealtime());
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') onAppFocus();
  });
  window.addEventListener('focus', onAppFocus);
}
// ─── INIT ───
if (isAuthenticated()) {
  initApp();
} else {
  showLockScreen();
}
</script>
