<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-title" content="Pappa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Pappa Tracker</title>
<link rel="icon" href="icona.svg">
<link rel="apple-touch-icon" href="icona-180.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="stili/base.css">
<link rel="stylesheet" href="stili/oggi.css">
<link rel="stylesheet" href="stili/crescita.css">
<link rel="stylesheet" href="stili/misure.css">
<link rel="stylesheet" href="stili/pappe.css">
<link rel="stylesheet" href="stili/vaccini.css">
<link rel="stylesheet" href="stili/accesso.css">
<script>
/* Mette il tema prima del primo disegno. I moduli partono dopo l'analisi della
   pagina: senza queste righe, chi ha scelto il tema scuro vede un lampo di bianco.
   Ripete in piccolo quello che fa tema.js, che resta la fonte vera: qui si decide
   solo acceso o spento, i colori stanno tutti in base.css. */
try {
  var scelta = localStorage.getItem('pappatracker_tema_v3') || 'sistema';
  var scuro = scelta === 'scuro' ||
    (scelta !== 'chiaro' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.tema = scelta;
  if (scuro) document.documentElement.dataset.scuro = '1';
} catch (e) { /* senza localStorage resta il tema chiaro */ }
</script>
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <div>
      <div class="hdr-t" id="titolo">Oggi</div>
      <div class="hdr-s" id="sotto"></div>
    </div>
    <div class="hdr-bs">
      <!-- L'icona qui è quella di «come il sistema»: tema.js la cambia all'avvio se
           la scelta salvata è un'altra. -->
      <div class="hdr-b" id="tema" role="button" tabindex="0" aria-label="Come il sistema"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.2"/><path d="M12 3.8a8.2 8.2 0 0 1 0 16.4z" style="fill:currentColor" stroke="none"/></svg></div>
      <div class="hdr-b pri" id="piu" role="button" tabindex="0" aria-label="Aggiungi" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></div>
    </div>
  </div>
</header>

<main id="vista"></main>

<nav class="tabbar" id="barra" aria-label="Sezioni">
  <div class="tabbar-in">
    <div class="tb on" data-sezione="oggi" role="button" tabindex="0">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg><span>Oggi</span>
    </div>
    <div class="tb" data-sezione="crescita" role="button" tabindex="0">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18"/><path d="M4 16l5-6 4 3.5L20 5"/></svg><span>Crescita</span>
    </div>
    <div class="tb" data-sezione="misure" role="button" tabindex="0">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18"/><path d="M7 7h10"/><path d="M8 17h8"/></svg><span>Misure</span>
    </div>
    <div class="tb" data-sezione="pappe" role="button" tabindex="0">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v7a3 3 0 0 0 6 0V4"/><path d="M9 11v9"/><path d="M17 4c-1.2 2-1.7 4-1.7 6.5 0 1.6.6 2.5 1.7 2.5s1.7-.9 1.7-2.5C18.7 8 18.2 6 17 4z"/><path d="M17 13v7"/></svg><span>Pappe</span>
    </div>
    <div class="tb" data-sezione="vaccini" role="button" tabindex="0">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 3.5 20.5 9.5"/><path d="M17.5 6.5 9 15l-3.5.9.9-3.5 8.5-8.5"/><path d="M4 20l2.5-2.5"/></svg><span>Vaccini</span>
    </div>
  </div>
</nav>

<div class="velo" id="velo" hidden></div>

<div class="sheet" id="tendina" role="dialog" aria-modal="true" hidden>
  <div class="grab" id="presa"></div>
  <h4 id="tendina-titolo" hidden></h4>
  <div class="sh-sub" id="tendina-sotto" hidden></div>
  <div id="tendina-corpo"></div>
</div>

<div class="avviso" id="avviso" hidden></div>

<!-- La schermata d'accesso. La riempie accesso-vista.js, e solo se serve entrare. -->
<div class="accesso" id="accesso" hidden></div>

<script type="module" src="app.js"></script>
<script type="module" src="oggi.js"></script>
<script type="module" src="crescita-vista.js"></script>
<script type="module" src="misure.js"></script>
<script type="module" src="pappe.js"></script>
<script type="module" src="vaccini.js"></script>
<script type="module" src="avvio.js"></script>
</body>
</html>
