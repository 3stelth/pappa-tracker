<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EAF0FB">
<meta name="apple-mobile-web-app-title" content="Pappa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Pappa Tracker</title>
<link rel="icon" href="icona.svg">
<link rel="apple-touch-icon" href="icona-180.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="stili/base.css">
<link rel="stylesheet" href="stili/oggi.css">
<link rel="stylesheet" href="stili/crescita.css">
<link rel="stylesheet" href="stili/misure.css">
<link rel="stylesheet" href="stili/pappe.css">
<link rel="stylesheet" href="stili/vaccini.css">
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <div>
      <div class="hdr-t" id="titolo">Oggi</div>
      <div class="hdr-s" id="sotto"></div>
    </div>
    <div class="hdr-bs">
      <div class="hdr-b" id="ingranaggio" role="button" tabindex="0" aria-label="Impostazioni">&#9881;&#65039;</div>
      <div class="hdr-b pri" id="piu" role="button" tabindex="0" aria-label="Aggiungi" hidden>+</div>
    </div>
  </div>
</header>

<main id="vista"></main>

<nav class="tabbar" id="barra" aria-label="Sezioni">
  <div class="tabbar-in">
    <div class="tb on" data-sezione="oggi" role="button" tabindex="0">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg><span>Oggi</span>
    </div>
    <div class="tb" data-sezione="crescita" role="button" tabindex="0">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M7 15l4-5 3 3 5-7"/></svg><span>Crescita</span>
    </div>
    <div class="tb" data-sezione="misure" role="button" tabindex="0">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18"/><path d="M5 8h14"/><path d="M7 16h10"/></svg><span>Misure</span>
    </div>
    <div class="tb" data-sezione="pappe" role="button" tabindex="0">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><circle cx="9" cy="9" r="2"/><circle cx="15" cy="15" r="2"/></svg><span>Pappe</span>
    </div>
    <div class="tb" data-sezione="vaccini" role="button" tabindex="0">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6v4l-6 6v8h6"/><path d="M8 9h8"/></svg><span>Vaccini</span>
    </div>
  </div>
</nav>

<div class="velo" id="velo" hidden></div>

<div class="sheet" id="tendina" role="dialog" aria-modal="true" hidden>
  <div class="grab" id="presa"></div>
  <h4 id="tendina-titolo" hidden></h4>
  <div class="sh-sub" id="tendina-sotto" hidden></div>
  <div id="tendina-corpo"></div>
</div>

<div class="avviso" id="avviso" hidden></div>

<script type="module" src="app.js"></script>
<script type="module" src="oggi.js"></script>
<script type="module" src="crescita-vista.js"></script>
<script type="module" src="misure.js"></script>
<script type="module" src="pappe.js"></script>
<script type="module" src="vaccini.js"></script>
<script type="module" src="avvio.js"></script>
</body>
</html>
